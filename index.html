<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - مطابقة تامة لمصحف المدينة</title>
    
    <!-- استدعاء ملف الخطوط الأصلي -->
    <link rel="stylesheet" href="fonts.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a202c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
        }

        /* لوحة التحكم المحدثة (أزرار + خانة إدخال رقم الصفحة) */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            align-items: center;
        }

        button {
            background-color: #dab473;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            color: #4a3b22;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e8c78c;
        }

        /* تنسيق خانة إدخال رقم الصفحة */
        .page-input-container {
            display: flex;
            align-items: center;
            gap: 5px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 60px;
            padding: 6px;
            text-align: center;
            border-radius: 15px;
            border: 2px solid #dab473;
            background-color: #fdfaf2;
            color: #4a3b22;
            font-weight: bold;
            font-size: 14px;
            outline: none;
        }

        /* إطار صفحة المصحف الورقي بدقة مطابقة */
        .mushaf-wrapper {
            background-color: #fdfaf2;
            border: 3px solid #dab473;
            border-radius: 6px;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 0.63; /* النسبة القياسية لصفحة المصحف الطولية */
            padding: 4% 4%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ترويسة الصفحة (اسم السورة ورقم الجزء) */
        .mushaf-header {
            display: flex;
            justify-content: space-between;
            color: #b58c49;
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid #e8dfc8;
            padding-bottom: 4px;
        }

        /* متن الآيات مع الحفاظ على التنسيق والأسطر */
        .mushaf-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            
            font-size: 22px;
            line-height: 1.8;
            text-align: justify;
            text-align-last: center;
            direction: rtl;
            
            white-space: pre-wrap; 
            word-break: normal;
        }

        /* تذييل الصفحة (رقم الصفحة) */
        .mushaf-footer {
            display: flex;
            justify-content: center;
            border-top: 1px solid #e8dfc8;
            padding-top: 4px;
        }

        .page-number-frame {
            border: 1px solid #b58c49;
            border-radius: 15px;
            padding: 1px 25px;
            color: #b58c49;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- لوحة التحكم المتكاملة (أزرار + إدخال رقم الصفحة) -->
    <div class="controls">
        <button onclick="changePage(1)">الصفحة التالية &larr;</button>
        
        <div class="page-input-container">
            <span>ص:</span>
            <input type="number" id="pageNumberInput" min="1" max="604" value="1" onchange="jumpToPage()" title="اكتب رقم الصفحة واضغط Enter">
            <span>/ 604</span>
        </div>

        <button onclick="changePage(-1)">&rarr; الصفحة السابقة</button>
    </div>

    <!-- حاوية صفحة المصحف -->
    <div class="mushaf-wrapper">
        
        <div class="mushaf-header">
            <span id="surahNameDisplay">الفاتحة</span>
            <span id="juzNameDisplay">الجزء الأول</span>
        </div>

        <div class="mushaf-body" id="quranContainer">
            <p style="text-align:center; color:#888; font-family:sans-serif; white-space:normal;">جاري تحميل المصحف...</p>
        </div>

        <div class="mushaf-footer">
            <div class="page-number-frame" id="pageNumDisplay">1</div>
        </div>

    </div>

    <script>
        let quranData = null;
        let currentPage = 1;

        async function fetchQuranData() {
            try {
                const response = await fetch('quran-glyphs.json');
                quranData = await response.json();
                renderPage(currentPage);
            } catch (error) {
                console.error("خطأ في التحميل:", error);
                document.getElementById('quranContainer').innerHTML = "<p style='color:red; text-align:center; font-family:sans-serif; white-space:normal;'>فشل تحميل البيانات</p>";
            }
        }

        function renderPage(pageNumber) {
            if (!quranData) return;

            const container = document.getElementById('quranContainer');
            let htmlContent = '';
            let detectedSurah = "";

            quranData.ayat.forEach(ayahData => {
                const pageChunks = ayahData.chunks.filter(chunk => chunk.p === pageNumber);
                
                pageChunks.forEach(chunk => {
                    if (!detectedSurah) {
                        detectedSurah = `سورة ${getSurahName(ayahData.surah)}`;
                    }
                    htmlContent += `<span style="font-family: '${chunk.family}';">${chunk.text}</span>`;
                });
            });

            if (htmlContent.trim() !== '') {
                container.innerHTML = htmlContent;
                
                // تحديث واجهة رقم الصفحة والإدخال
                document.getElementById('pageNumDisplay').innerText = pageNumber;
                document.getElementById('pageNumberInput').value = pageNumber;
                document.getElementById('surahNameDisplay').innerText = detectedSurah || `صفحة ${pageNumber}`;
                
                const juz = Math.ceil(pageNumber / 20);
                document.getElementById('juzNameDisplay').innerText = `الجزء ${juz}`;
            } else {
                container.innerHTML = "<p style='text-align:center; color:#888; font-family:sans-serif; white-space:normal;'>الصفحة غير متوفرة.</p>";
            }
        }

        // تقليب الصفحات عبر الأزرار
        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        // الانتقال المباشر عن طريق كتابة رقم الصفحة في الخانة
        function jumpToPage() {
            const inputField = document.getElementById('pageNumberInput');
            let targetPage = parseInt(inputField.value);

            if (targetPage >= 1 && targetPage <= 604) {
                currentPage = targetPage;
                renderPage(currentPage);
            } else {
                alert("الرجاء إدخال رقم صفحة صحيح بين 1 و 604");
                inputField.value = currentPage; // إعادة الرقم القديم في حال الخطأ
            }
        }

        fetchQuranData();
    </script>

</body>
</html>
