<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المصحف الشريف - مطابق للصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* شريط تحكم علوي أنيق */
        .top-bar {
            width: 100%;
            background-color: #1a1a1a;
            color: white;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* حاوية صفحة المصحف */
        .mushaf-container {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #ffffff;
        }

        /* جعل ملف الـ SVG يملأ الشاشة تماماً ويحافظ على نسبته */
        .mushaf-svg-frame {
            width: 100%;
            height: 100%;
            max-width: 600px; /* يحافظ على مظهر الصفحة عمودياً كالـ موبايل */
            object-fit: contain;
        }

        /* طبقة التظليل الشفافة فوق الآيات */
        .ayah-overlay {
            position: absolute;
            background-color: rgba(255, 235, 59, 0.4); /* أصفر شفاف دقيق */
            border-radius: 4px;
            pointer-events: none;
            transition: all 0.3s ease;
            display: none;
        }
    </style>
</head>
<body>

    <!-- شريط التحكم -->
    <div class="top-bar">
        <button id="play-btn" onclick="togglePlay()" class="px-4 py-1.5 bg-green-600 hover:bg-green-500 font-bold text-sm rounded transition font-sans">
            تشغيل العفاسي ▶
        </button>

        <div class="flex items-center gap-3 text-sm font-sans">
            <button onclick="changePage(-1)" class="bg-gray-800 px-3 py-1 rounded hover:bg-gray-700">السابق</button>
            <span id="page-label" class="font-bold text-amber-400">صـ 1</span>
            <button onclick="changePage(1)" class="bg-gray-800 px-3 py-1 rounded hover:bg-gray-700">التالي</button>
        </div>
    </div>

    <!-- عرض صفحة المصحف باستخدام ملف الـ SVG الخاص بك -->
    <div class="mushaf-container" id="container">
        <!-- سيتم تحميل ملف الـ SVG هنا -->
        <div id="svg-wrapper" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; position:relative;">
            <div class="text-amber-800 font-bold font-sans">جاري تحميل الصفحة...</div>
        </div>
    </div>

    <audio id="quran-audio" class="hidden"></audio>

    <script>
        const CLIENT_ID = '7e8ed480-bcca-4442-985e-7d45ac9cbc06';
        const CLIENT_SECRET = 'qfcs_74a0ff300e7b4b568b5724d8a60ae377ef801ab376a146c39a9606b3a7f5e104';

        let currentPage = 1; // الفاتحة هي صفحة 1 لديك في الملفات
        let versesData = [];
        let isPlaying = false;
        let currentVerseIndex = 0;

        const svgWrapper = document.getElementById('svg-wrapper');
        const pageLabel = document.getElementById('page-label');
        const audioEl = document.getElementById('quran-audio');
        const playBtn = document.getElementById('play-btn');

        async function loadPage(page) {
            stopAudio();
            pageLabel.innerText = 'صـ ' + page;
            svgWrapper.innerHTML = '<div class="text-amber-800 font-bold font-sans">جاري تحميل الصفحة...</div>';

            try {
                // 1. جلب ملف الـ SVG الفعلي من مجلدك (مثل 1.svgz أو 1.svg)
                const res = await fetch(`./${page}.svgz`);
                const svgText = await res.text();
                svgWrapper.innerHTML = svgText;

                // تنسيق الـ SVG ليعبئ الشاشة
                const svgElement = svgWrapper.querySelector('svg');
                if (svgElement) {
                    svgElement.classList.add('mushaf-svg-frame');
                }

                // 2. جلب بيانات الآيات لنفس الصفحة لتفعيل التلاوة والصوت
                const apiRes = await fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?page_number=${page}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'x-client-id': CLIENT_ID,
                        'Authorization': `Bearer ${CLIENT_SECRET}`
                    }
                });
                const apiData = await apiRes.json();
                versesData = apiData.verses || [];

            } catch (err) {
                svgWrapper.innerHTML = '<div class="text-red-600 font-sans">فشل تحميل ملف الصفحة. تأكد من وجوده في المستودع.</div>';
                console.error(err);
            }
        }

        function togglePlay() {
            if (isPlaying) {
                stopAudio();
            } else {
                if (versesData.length > 0) playVerse();
            }
        }

        function playVerse() {
            if (currentVerseIndex >= versesData.length) {
                stopAudio();
                return;
            }

            isPlaying = true;
            playBtn.innerText = 'إيقاف ⏸';
            playBtn.className = 'px-4 py-1.5 bg-red-600 hover:bg-red-500 font-bold text-sm rounded transition font-sans';

            const verseKey = versesData[currentVerseIndex].verse_key;

            // جلب ورش الصوت وتلاوة الآية
            fetch(`https://api.quran.com/api/v4/recitations/7/by_ayah/${verseKey}`)
                .then(res => res.json())
                .then(data => {
                    if (data.audio_files && data.audio_files.length > 0) {
                        let audioUrl = data.audio_files[0].url;
                        audioEl.src = audioUrl.startsWith('http') ? audioUrl : `https://verses.quran.com/${audioUrl}`;
                        audioEl.play();
                    }
                });
        }

        function stopAudio() {
            isPlaying = false;
            audioEl.pause();
            playBtn.innerText = 'تشغيل العفاسي ▶';
            playBtn.className = 'px-4 py-1.5 bg-green-600 hover:bg-green-500 font-bold text-sm rounded transition font-sans';
        }

        audioEl.onended = () => {
            currentVerseIndex++;
            playVerse();
        };

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                currentVerseIndex = 0;
                loadPage(currentPage);
            }
        }

        // بدء التشغيل من صفحة 1 (سورة الفاتحة بناءً على صورتك)
        loadPage(currentPage);
    </script>
</body>
</html>
