<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - تلاوة العفاسي</title>
    <style>
        :root {
            --primary: #2c3e50;
            --bg: #ececeb;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --highlight: #63b8ff; /* لون أزرق فاتح للتظليل */
            --mint: #c0e2ca; /* أخضر النعناعي المستوحى من التصميم المطلوب */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls-container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            width: 90%;
            max-width: 700px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #1a252f;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .page-navigation {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            padding: 5px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .page-navigation input {
            width: 50px;
            text-align: center;
            font-size: 16px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-weight: bold;
        }

        /* حاوية صفحة المصحف: إطار مسنّن أخضر نعناعي (بنفس روح تطبيقات المصحف المطلوبة) */
        .quran-page-container {
            width: 100%;
            max-width: 650px;
            position: relative;
            background-color: #ffffff;

        /* حشوة داخلية تكشف سماكة الإطار المسنن حول الصفحة */
        .quran-page-pad {

        }

<body>

    <div class="controls-container">
        <button id="nextPage">التالية &gt;</button>
        
        <div class="page-navigation">
            <label for="pageInput">صفحة:</label>
            <input type="number" id="pageInput" min="1" max="604" value="1">
            <button id="goPage" style="padding: 5px 10px; font-size: 13px;">انتقال</button>
        </div>

        <button id="prevPage">&lt; السابقة</button>
        <button id="playSequenceBtn">تشغيل الصفحة 🎧</button>
        <button id="stopBtn" style="display: none; background-color: #e74c3c;">إيقاف ⏹️</button>
    </div>

    <div class="quran-page-container">
        <div class="quran-page-pad">
            <!-- يتم تحميل ملف الـ SVG هنا -->
            <object id="quranSvg" data="001.svg" type="image/svg+xml"></object>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let ayahsData = [];
        let currentAyahIndex = 0;
        let audioPlayer = new Audio();
        let playMode = 'stopped'; // 'sequence', 'repeat', 'stopped'

        const pageInput = document.getElementById('pageInput');
        const quranSvg = document.getElementById('quranSvg');
        const playSequenceBtn = document.getElementById('playSequenceBtn');
        const stopBtn = document.getElementById('stopBtn');

        // جلب بيانات الآيات من الـ API
        async function fetchPageData(page) {
            try {
                playSequenceBtn.disabled = true;
                playSequenceBtn.textContent = 'جاري التحميل...';
                
                const response = await fetch(`https://api.alquran.cloud/v1/page/${page}/ar.alafasy`);
                const data = await response.json();
                
                if (data.code === 200) {
                    ayahsData = data.data.ayahs;
                    playSequenceBtn.disabled = false;
                    playSequenceBtn.textContent = 'تشغيل الصفحة 🎧';
                }
            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                playSequenceBtn.textContent = 'خطأ بالتحميل';
            }
        }

        // تحديث عرض الصفحة
        function updatePageDisplay(pageNumber) {
            currentPage = parseInt(pageNumber);
            if (currentPage < 1) currentPage = 1;
            if (currentPage > 604) currentPage = 604;
            
            pageInput.value = currentPage;
            const formattedNum = currentPage.toString().padStart(3, '0');
            quranSvg.data = `${formattedNum}.svg`;
            
            stopAudio();
            fetchPageData(currentPage);
        }

        // تشغيل الآية
        function playCurrentAyah() {
            if (currentAyahIndex >= ayahsData.length) {
                stopAudio();
                return;
            }

            const currentAyah = ayahsData[currentAyahIndex];
            audioPlayer.src = currentAyah.audio;
            audioPlayer.play();
            
            playSequenceBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';

            // تظليل الآية بناءً على رقم الآية والسورة
            highlightAyahInSvg(currentAyah.numberInSurah, currentAyah.surah.number);

            audioPlayer.onended = () => {
                if (playMode === 'repeat') {
                    // إعادة تشغيل نفس الآية
                    audioPlayer.play();
                } else if (playMode === 'sequence') {
                    // الانتقال للآية التالية
                    currentAyahIndex++;
                    playCurrentAyah();
                }
            };
        }

        // إيقاف الصوت
        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            playMode = 'stopped';
            playSequenceBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            removeHighlightFromSvg();
        }

        // التظليل الدقيق بناءً على الـ data attributes داخل الـ SVG
        function highlightAyahInSvg(ayahNum, surahNum) {
            try {
                const svgDoc = quranSvg.contentDocument;
                if (!svgDoc) return;

                removeHighlightFromSvg(svgDoc);

                // البحث عن كل الكلمات التي تطابق الآية والسورة
                const allWords = svgDoc.querySelectorAll('g[data-aya]');
                
                allWords.forEach(word => {
                    const wordAya = parseInt(word.getAttribute('data-aya'));
                    const wordSurah = parseInt(word.getAttribute('data-surah'));
                    
                    if (wordAya === ayahNum && wordSurah === surahNum) {
                        word.classList.add('active-ayah');
                        const paths = word.querySelectorAll('path');
                        paths.forEach(path => {
                            path.dataset.originalFill = path.style.fill || path.getAttribute('fill') || ''; 
                            path.style.fill = 'var(--highlight)';
                        });
                    }
                });
            } catch (e) {
                console.log("تنبيه: لن يعمل التظليل إلا عند رفع الملف على استضافة (GitHub Pages) أو سيرفر محلي (Live Server) بسبب سياسات الأمان CORS.");
            }
        }

        // إزالة التظليل
        function removeHighlightFromSvg(svgDoc = quranSvg.contentDocument) {
            if (!svgDoc) return;
            const activeWords = svgDoc.querySelectorAll('.active-ayah');
            activeWords.forEach(word => {
                word.classList.remove('active-ayah');
                const paths = word.querySelectorAll('path');
                paths.forEach(path => {
                    // استعادة اللون الأصلي للكلمات والتشكيل
                    path.style.fill = path.dataset.originalFill || ''; 
                });
            });
        }

        // بناء مسار "الشريط" المدبب الطرفين (يشبه الشارة الموجودة في تطبيقات المصحف)
        // لصندوق اسم السورة، حول أبعاد (x,y,w,h) معطاة، مع طول رأس مدبب "tip"
        function buildSurahBannerPath(x, y, w, h, tip) {
            const midY = y + h / 2;
            return `M ${x},${y} L ${x + w},${y} `
                 + `Q ${x + w + tip * 0.6},${y + h * 0.15} ${x + w + tip},${midY} `
                 + `Q ${x + w + tip * 0.6},${y + h * 0.85} ${x + w},${y + h} `
                 + `L ${x},${y + h} `
                 + `Q ${x - tip * 0.6},${y + h * 0.85} ${x - tip},${midY} `
                 + `Q ${x - tip * 0.6},${y + h * 0.15} ${x},${y} Z`;
        }

        // إضافة شريط أخضر بعرض الصفحة + صندوق أبيض مدبب خلف كل سطر "اسم سورة"
        // موجود أصلاً داخل ملف الـ SVG (لا نغيّر رسم الاسم نفسه، فقط نزيّن خلفه)
        function decorateSurahNames(svgDoc) {
            const SVGNS = 'http://www.w3.org/2000/svg';
            const pageInner = svgDoc.querySelector('#md-page-inner');
            const rectAttr = pageInner && pageInner.getAttribute('data-rect');
            if (!rectAttr) return;
            const [rx, ry, rw] = rectAttr.split(',').map(Number);

            svgDoc.querySelectorAll('g[data-type="surah-name"]').forEach(line => {
                if (line.dataset.decorated) return;
                const bbox = line.getBBox();
                const padY = 9;
                const bandY = bbox.y - padY;
                const bandH = bbox.height + padY * 2;

                // الشريط الأخضر (يمتد على كامل عرض منطقة النص في الصفحة)
                const band = svgDoc.createElementNS(SVGNS, 'rect');
                band.setAttribute('x', rx);
                band.setAttribute('y', bandY);
                band.setAttribute('width', rw);
                band.setAttribute('height', bandH);
                band.setAttribute('fill', '#c0e2ca');
                line.parentNode.insertBefore(band, line);

                // الصندوق الأبيض المدبب حول اسم السورة فقط
                const padX = 12, tip = 13;
                const banner = svgDoc.createElementNS(SVGNS, 'path');
                banner.setAttribute('d', buildSurahBannerPath(
                    bbox.x - padX, bandY + 3, bbox.width + padX * 2, bandH - 6, tip
                ));
                banner.setAttribute('fill', '#fdfdfb');
                line.parentNode.insertBefore(banner, line);

                line.dataset.decorated = '1';
            });
        }

        // الاستماع لتحميل الـ SVG لإضافة التفاعلية (النقر وتأثير التمرير)
        quranSvg.addEventListener('load', () => {
            try {
                const svgDoc = quranSvg.contentDocument;
                if (!svgDoc) return;

                // حقن ستايل CSS داخل الـ SVG لتمكين تأثير الـ hover
                const style = svgDoc.createElementNS('http://www.w3.org/2000/svg', 'style');
                style.textContent = `
                    g[data-aya] { cursor: pointer; }
                    g[data-aya]:hover path { fill: #85c1e9 !important; transition: fill 0.2s; }
                    g[data-type="aya-mark"] [id*="ornament"] path { fill: #a9d6b4; }
                    g[data-type="aya-mark"] [id*="number"] path { fill: #2c3e50; }
                `;
                svgDoc.documentElement.appendChild(style);

                // تزيين أسطر أسماء السور (شريط أخضر + صندوق مدبب) لكل صفحة تُحمَّل
                decorateSurahNames(svgDoc);

                // الاستماع للنقر على الكلمات
                svgDoc.addEventListener('click', (e) => {
                    const targetWord = e.target.closest('g[data-aya]');
                    if (targetWord) {
                        const clickedAya = parseInt(targetWord.getAttribute('data-aya'));
                        const clickedSurah = parseInt(targetWord.getAttribute('data-surah'));
                        
                        // البحث عن الآية في المصفوفة لتشغيلها
                        const index = ayahsData.findIndex(a => a.numberInSurah === clickedAya && a.surah.number === clickedSurah);
                        if (index !== -1) {
                            stopAudio();
                            currentAyahIndex = index;
                            playMode = 'repeat'; // تعيين وضع التكرار عند النقر
                            playCurrentAyah();
                        }
                    }
                });
            } catch (error) {
                console.warn("سياسة المتصفح تمنع قراءة وتعديل محتوى SVG محلياً. استخدم Live Server أو ارفعها لـ GitHub.");
            }
        });

        // ------------------ أزرار التحكم والربط ------------------

        playSequenceBtn.addEventListener('click', () => {
            if (ayahsData.length > 0) {
                playMode = 'sequence';
                currentAyahIndex = 0;
                playCurrentAyah();
            }
        });

        stopBtn.addEventListener('click', stopAudio);

        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < 604) updatePageDisplay(currentPage + 1);
        });

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) updatePageDisplay(currentPage - 1);
        });

        document.getElementById('goPage').addEventListener('click', () => {
            updatePageDisplay(pageInput.value);
        });

        pageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') updatePageDisplay(pageInput.value);
        });

        // تشغيل التهيئة الأولية (الصفحة 1)
        updatePageDisplay(1);
    </script>
</body>
</html>
