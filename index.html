<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المصحف الشريف - تظليل تفاعلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Amiri Quran', serif;
        }

        /* شريط تحكم علوي أنيق وصغير */
        .top-bar {
            width: 100%;
            background-color: #1a1a1a;
            color: white;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 50;
        }

        /* حاوية المصحف بيضاء بالكامل وتاخذ باقي المساحة */
        .mushaf-screen {
            flex: 1;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            background-color: #ffffff;
            text-align: justify;
            text-justify: kashida;
            line-height: 2.8;
            font-size: 1.8rem;
        }

        @media (min-width: 768px) {
            .mushaf-screen {
                font-size: 2.4rem;
                padding: 40px 80px;
            }
        }

        /* تظليل الآية النشطة أثناء التلاوة */
        .active-ayah {
            background-color: #fef08a !important; /* أصفر خفيف وواضح */
            color: #991b1b !important; /* أحمر داكن للنص المقروء */
            border-radius: 6px;
            padding: 2px 6px;
            box-shadow: 0 0 4px rgba(250, 204, 21, 0.5);
        }

        .ayah-item {
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline;
        }

        .ayah-item:hover {
            background-color: #fef9c3;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- شريط التحكم -->
    <div class="top-bar">
        <button id="play-btn" onclick="togglePlay()" class="px-4 py-1.5 bg-green-600 hover:bg-green-500 font-bold text-sm rounded transition font-sans">
            تشغيل العفاسي ▶
        </button>

        <div class="flex items-center gap-3 text-sm font-sans">
            <button onclick="changePage(-1)" class="bg-gray-800 px-3 py-1 rounded hover:bg-gray-700">السابق</button>
            <span id="page-label" class="font-bold text-amber-400">صـ 2</span>
            <button onclick="changePage(1)" class="bg-gray-800 px-3 py-1 rounded hover:bg-gray-700">التالي</button>
        </div>
    </div>

    <!-- شاشة المصحف البيضاء -->
    <div id="mushaf-content" class="mushaf-screen">
        <div class="text-center text-amber-800 font-bold mt-20 font-sans">جاري تحميل الآيات...</div>
    </div>

    <audio id="quran-audio" class="hidden"></audio>

    <script>
        const CLIENT_ID = '7e8ed480-bcca-4442-985e-7d45ac9cbc06';
        const CLIENT_SECRET = 'qfcs_74a0ff300e7b4b568b5724d8a60ae377ef801ab376a146c39a9606b3a7f5e104';

        let currentPage = 2; // نبدأ بصفحة 2
        let versesData = [];
        let isPlaying = false;
        let currentVerseIndex = 0;

        const contentDiv = document.getElementById('mushaf-content');
        const pageLabel = document.getElementById('page-label');
        const audioEl = document.getElementById('quran-audio');
        const playBtn = document.getElementById('play-btn');

        const toArabicNum = (num) => num.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

        function loadPage(page) {
            stopAudio();
            pageLabel.innerText = 'صـ ' + page;
            contentDiv.innerHTML = '<div class="text-center text-amber-800 font-bold mt-20 font-sans">جاري تحميل الآيات...</div>';

            fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?page_number=${page}`, {
                headers: {
                    'Content-Type': 'application/json',
                    'x-client-id': CLIENT_ID,
                    'Authorization': `Bearer ${CLIENT_SECRET}`
                }
            })
            .then(res => res.json())
            .then(data => {
                versesData = data.verses || [];
                contentDiv.innerHTML = '';

                versesData.forEach((verse, index) => {
                    const span = document.createElement('span');
                    span.className = 'ayah-item mx-1';
                    span.innerHTML = `${verse.text_uthmani} <span class="text-amber-800 font-normal text-[85%]">﴿${toArabicNum(verse.verse_key.split(':')[1])}﴾</span>`;
                    span.dataset.verseKey = verse.verse_key;
                    
                    // النقر على الآية لتشغيلها وتظليلها فوراً
                    span.onclick = () => {
                        currentVerseIndex = index;
                        playVerse();
                    };

                    contentDiv.appendChild(span);
                });
            })
            .catch(err => {
                contentDiv.innerHTML = '<div class="text-red-600 text-center mt-20 font-sans">حدث خطأ في جلب الآيات.</div>';
                console.error(err);
            });
        }

        function togglePlay() {
            if (isPlaying) {
                stopAudio();
            } else {
                if (versesData.length > 0) playVerse();
            }
        }

        function playVerse() {
            if (currentVerseIndex >= versesData.length) {
                stopAudio();
                return;
            }

            isPlaying = true;
            playBtn.innerText = 'إيقاف ⏸';
            playBtn.className = 'px-4 py-1.5 bg-red-600 hover:bg-red-500 font-bold text-sm rounded transition font-sans';

            const verseKey = versesData[currentVerseIndex].verse_key;
            highlightActiveVerse(verseKey);

            fetch(`https://api.quran.com/api/v4/recitations/7/by_ayah/${verseKey}`)
                .then(res => res.json())
                .then(data => {
                    if (data.audio_files && data.audio_files.length > 0) {
                        let audioUrl = data.audio_files[0].url;
                        audioEl.src = audioUrl.startsWith('http') ? audioUrl : `https://verses.quran.com/${audioUrl}`;
                        audioEl.play();
                    }
                });
        }

        function stopAudio() {
            isPlaying = false;
            audioEl.pause();
            playBtn.innerText = 'تشغيل العفاسي ▶';
            playBtn.className = 'px-4 py-1.5 bg-green-600 hover:bg-green-500 font-bold text-sm rounded transition font-sans';
            highlightActiveVerse('');
        }

        function highlightActiveVerse(verseKey) {
            document.querySelectorAll('.active-ayah').forEach(el => el.classList.remove('active-ayah'));
            if (verseKey) {
                const target = contentDiv.querySelector(`[data-verse-key="${verseKey}"]`);
                if (target) {
                    target.classList.add('active-ayah');
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        audioEl.onended = () => {
            currentVerseIndex++;
            playVerse();
        };

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                currentVerseIndex = 0;
                loadPage(currentPage);
            }
        }

        loadPage(currentPage);
    </script>
</body>
</html>
