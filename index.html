<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف المطابق للورقي</title>
    
    <!-- استدعاء ملف الخطوط الأصلي -->
    <link rel="stylesheet" href="fonts.css">
    
    <style>
        body {
            background-color: #e5e7eb; /* لون خلفية الشاشة */
            display: flex;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        /* تصميم صفحة المصحف */
        .mushaf-page {
            background-color: #fdfaf2; /* لون الورق الأصفر الخفيف */
            border: 2px solid #dab473; /* إطار مذهب */
            width: 100%;
            max-width: 700px;
            min-height: 900px;
            padding: 50px 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            text-align: center;
            
            /* إعدادات ضبط الأسطر بدقة */
            line-height: 2.2;
            text-align-last: center; 
            font-size: 38px; /* حجم الخط الأساسي */
        }

        /* كلاس التتبع الصوتي (سنستخدمه لاحقاً) */
        .active-ayah {
            color: #0f766e;
            background-color: rgba(15, 118, 110, 0.1);
            border-radius: 5px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- الحاوية التي ستظهر فيها الآيات -->
    <div class="mushaf-page" id="quranContainer">
        <h3 style="color: #888; font-family: sans-serif;">جاري تحميل المصحف...</h3>
    </div>

    <script>
        async function renderPage(targetPageNumber) {
            try {
                // جلب البيانات من ملف JSON
                const response = await fetch('quran-glyphs.json');
                const data = await response.json();
                
                const container = document.getElementById('quranContainer');
                container.innerHTML = ''; // تفريغ رسالة التحميل
                
                let htmlContent = '';

                // الدوران على جميع الآيات في الملف
                data.ayat.forEach(ayahData => {
                    // البحث داخل أجزاء (chunks) الآية عن الصفحة المطلوبة
                    const pageChunks = ayahData.chunks.filter(chunk => chunk.p === targetPageNumber);
                    
                    pageChunks.forEach(chunk => {
                        // السحر هنا: نضع النص داخل span ونعطيه اسم الخط المخصص له من ملف JSON مباشرة
                        // ونعطيه id يحمل رقم السورة والآية لسهولة تتبعه صوتياً لاحقاً
                        htmlContent += `
                            <span 
                                id="ayah-${ayahData.surah}-${ayahData.ayah}" 
                                style="font-family: '${chunk.family}';"
                            >
                                ${chunk.text}
                            </span>
                        `;
                    });
                });

                container.innerHTML = htmlContent;

            } catch (error) {
                console.error("حدث خطأ:", error);
                document.getElementById('quranContainer').innerHTML = `
                    <div style="color: red; font-family: sans-serif;">
                        خطأ في تحميل البيانات.<br>
                        تأكد من فتح الصفحة عبر Live Server ليتمكن المتصفح من قراءة ملف الـ JSON.
                    </div>
                `;
            }
        }

        // استدعاء الدالة لطباعة الصفحة رقم 1 (الفاتحة)
        renderPage(1);
    </script>

</body>
</html>
