<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف تفاعلي - تتبع وتلاوة العفاسي</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #eef2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }
        
        .controls {
            background: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        button {
            padding: 8px 18px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #1e7e34;
            color: #ffffff;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.97); }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .page-info {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            min-width: 90px;
            text-align: center;
        }

        /* تصميم حاوية المصحف الجديدة */
        .quran-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 7 / 10; /* للحفاظ على أبعاد صفحة المصحف الطبيعية */
            
            /* لون الخلفية الأخضر الفاتح */
            background-color: #d2ebd2; 
            
            /* إذا قمت بتنزيل صورة الإطار، قم بإزالة علامتي التعليق /* */ من السطر التالي */
            /* background-image: url('frame.png'); */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            
            /* هوامش داخلية لإبعاد النص القرآني عن الحواف والإطار الزخرفي */
            padding: 10% 8%; 
        }

        object {
            width: 100%;
            height: 100%;
            background: transparent; /* لجعل الـ SVG شفافاً ويظهر اللون الأخضر خلفه */
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="nextPage()">الصفحة التالية &lt;</button>
        <span class="page-info">صفحة: <span id="page-num">1</span></span>
        <button onclick="prevPage()">&gt; الصفحة السابقة</button>
        <button id="play-btn" onclick="toggleAudio()" style="background-color: #0b5ed7;">▶ تشغيل الصفحة</button>
    </div>

    <div class="quran-container">
        <!-- يتم تحميل ملف الـ SVG برمجياً هنا -->
        <object id="quran-svg" type="image/svg+xml" data=""></object>
    </div>

    <script>
        let currentPage = 1; 
        const totalPages = 604;
        let ayahsData = [];
        let currentAyahIndex = 0;
        let audioPlayer = new Audio();
        let isPlaying = false;

        const svgObject = document.getElementById('quran-svg');
        const pageNumDisplay = document.getElementById('page-num');
        const playBtn = document.getElementById('play-btn');

        // تحويل الرقم إلى صيغة 3 خانات (مثال: 1 تصبح 001) لتطابق أسماء الملفات
        function formatPageNumber(page) {
            return String(page).padStart(3, '0');
        }

        async function loadPage(page) {
            currentPage = page;
            pageNumDisplay.innerText = page;
            stopAudio();

            // تحميل ملف الـ SVG بالاسم الثلاثي (مثل 001.svg)
            const fileName = `${formatPageNumber(page)}.svg`;
            svgObject.data = fileName;

            try {
                // جلب بيانات التلاوة الخاصة بالصفحة من الـ API
                const response = await fetch(`https://api.alquran.cloud/v1/page/${page}/ar.alafasy`);
                const data = await response.json();
                
                if(data.code === 200) {
                    ayahsData = data.data.ayahs;
                    console.log(`تم تحميل بيانات الصفحة ${page} بنجاح`);
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات التلاوة:", error);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) loadPage(currentPage + 1);
        }

        function prevPage() {
            if (currentPage > 1) loadPage(currentPage - 1);
        }

        function toggleAudio() {
            if (isPlaying) {
                stopAudio();
            } else {
                if (ayahsData.length > 0) {
                    isPlaying = true;
                    playBtn.innerText = "⏸ إيقاف";
                    playBtn.style.backgroundColor = "#dc3545";
                    currentAyahIndex = 0;
                    playAyah(currentAyahIndex);
                }
            }
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            isPlaying = false;
            playBtn.innerText = "▶ تشغيل الصفحة";
            playBtn.style.backgroundColor = "#0b5ed7";
            clearHighlight();
        }

        function playAyah(index) {
            // إذا انتهت آيات الصفحة، ننتقل للصفحة التالية تلقائياً
            if (index >= ayahsData.length) {
                if (currentPage < totalPages) {
                    loadPage(currentPage + 1).then(() => {
                        // الانتظار قليلاً حتى يتم رسم الـ SVG الجديد قبل بدء الصوت
                        setTimeout(() => toggleAudio(), 800);
                    });
                } else {
                    stopAudio();
                }
                return;
            }

            const ayah = ayahsData[index];
            audioPlayer.src = ayah.audio;
            audioPlayer.play();

            // تظليل الآية الحالية
            highlightAyah(ayah.surah.number, ayah.numberInSurah);

            // عند انتهاء تلاوة الآية، نشغل الآية التي تليها
            audioPlayer.onended = () => {
                currentAyahIndex++;
                playAyah(currentAyahIndex);
            };
        }

        function highlightAyah(surahNum, ayahNum) {
            const svgDoc = svgObject.contentDocument;
            if (!svgDoc) {
                console.warn("جاري تحميل الـ SVG...");
                return;
            }

            clearHighlight();

            const sNumPad = String(surahNum).padStart(3, '0');
            const aNumPad = String(ayahNum).padStart(3, '0');

            // مصفوفة مرنة للبحث عن الـ ID الخاص بالآية بناءً على هيكلة الملفات الشائعة
            const possibleSelectors = [
                `[id*="ayah_${surahNum}_${ayahNum}"]`,
                `[id*="aya_${surahNum}_${ayahNum}"]`,
                `[id*="ayah-${surahNum}-${ayahNum}"]`,
                `[id*="aya-${surahNum}-${ayahNum}"]`,
                `[id*="${sNumPad}_${aNumPad}"]`,
                `#s${surahNum}_a${ayahNum}`,
                `#s${surahNum}a${ayahNum}`
            ];

            let ayahElement = null;
            for (let selector of possibleSelectors) {
                ayahElement = svgDoc.querySelector(selector);
                if (ayahElement) break;
            }

            if (ayahElement) {
                // تلوين الآية باللون الذهبي
                applyColorToTree(ayahElement, "#b8860b");
            } else {
                console.warn(`لم يتم العثور على الآية رقم ${ayahNum} من سورة ${surahNum} في ملف الـ SVG.`);
            }
        }

        function applyColorToTree(element, color) {
            element.dataset.originalFill = element.getAttribute("fill") || "";
            element.style.fill = color;
            element.style.transition = "fill 0.3s ease";

            // تلوين جميع الكلمات (المسارات) داخل الآية
            const subPaths = element.querySelectorAll("path, g");
            subPaths.forEach(el => {
                el.dataset.originalFill = el.getAttribute("fill") || "";
                el.style.fill = color;
                el.style.transition = "fill 0.3s ease";
            });
        }

        function clearHighlight() {
            const svgDoc = svgObject.contentDocument;
            if (!svgDoc) return;

            const styledElements = svgDoc.querySelectorAll('[data-original-fill]');
            styledElements.forEach(el => {
                if (el.dataset.originalFill) {
                    el.style.fill = el.dataset.originalFill;
                } else {
                    el.style.removeProperty("fill");
                }
                delete el.dataset.originalFill;
            });
        }

        // تحميل الصفحة الأولى عند فتح الموقع
        window.onload = () => loadPage(currentPage);
    </script>
</body>
</html>
