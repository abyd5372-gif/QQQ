<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف المطابق للورقي - تصميم متجاوب</title>
    
    <!-- استدعاء ملف الخطوط -->
    <link rel="stylesheet" href="fonts.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5; /* لون خلفية الشاشة خارج المصحف */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2vh 10px;
        }

        /* حاوية المصحف الأساسية */
        .mushaf-wrapper {
            background-color: #FDF9EC; /* لون ورق المصحف الأصلي */
            width: 100%;
            max-width: 550px; /* الحد الأقصى لعرض شاشة الكمبيوتر */
            aspect-ratio: 0.65; /* نسبة الطول والعرض المطابقة للمصحف الحقيقي */
            padding: 2.5% 4%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0d4b8;
            
            /* التخطيط الداخلي للصفحة */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* الترويسة العلوية (الجزء واسم السورة) */
        .mushaf-header {
            display: flex;
            justify-content: space-between;
            color: #b58c49;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: bold;
            margin-bottom: 2%;
        }

        /* الحاوية التي تحمل الآيات */
        .mushaf-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            
            /* إعدادات ضبط الـ 15 سطراً */
            font-size: clamp(18px, 4.5vw, 32px); /* حجم خط مرن يتكيف مع الشاشة */
            line-height: 1.9;
            text-align: justify;
            text-align-last: center;
            word-break: normal; 
        }

        /* تذييل الصفحة (رقم الصفحة) */
        .mushaf-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 2%;
        }

        .page-number-frame {
            border: 1px solid #b58c49;
            border-radius: 20px;
            padding: 2px 25px;
            color: #b58c49;
            font-size: clamp(12px, 3vw, 16px);
            font-weight: bold;
            background-color: transparent;
        }

        /* أزرار التحكم المخفية عن التصميم الأساسي */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }

        button {
            background-color: #b58c49;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background-color: #9c783c;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="changePage(1)">الصفحة التالية &larr;</button>
        <button onclick="changePage(-1)">&rarr; الصفحة السابقة</button>
    </div>

    <!-- الإطار الكامل لصفحة المصحف -->
    <div class="mushaf-wrapper">
        
        <!-- الترويسة -->
        <div class="mushaf-header">
            <span id="surahNameDisplay">الفاتحة</span>
            <span id="juzNameDisplay">الجزء الأول</span>
        </div>

        <!-- متن الآيات -->
        <div class="mushaf-body" id="quranContainer">
            <p style="text-align:center; color:#888;">جاري تحميل المصحف...</p>
        </div>

        <!-- التذييل ورقم الصفحة -->
        <div class="mushaf-footer">
            <div class="page-number-frame" id="pageNumDisplay">1</div>
        </div>

    </div>

    <script>
        let quranData = null;
        let currentPage = 1;

        async function fetchQuranData() {
            try {
                const response = await fetch('quran-glyphs.json');
                quranData = await response.json();
                renderPage(currentPage);
            } catch (error) {
                console.error("خطأ:", error);
                document.getElementById('quranContainer').innerHTML = "<p style='color:red;'>فشل التحميل</p>";
            }
        }

        function renderPage(pageNumber) {
            if (!quranData) return;

            const container = document.getElementById('quranContainer');
            let htmlContent = '';
            let currentSurah = '';
            
            quranData.ayat.forEach(ayahData => {
                const pageChunks = ayahData.chunks.filter(chunk => chunk.p === pageNumber);
                
                if(pageChunks.length > 0) {
                    // تحديث اسم السورة في الترويسة برمجياً
                    // ملاحظة: يمكنك لاحقاً جلب الاسم الدقيق من ملف quran.json
                    currentSurah = `سورة رقم ${ayahData.surah}`; 
                }

                pageChunks.forEach(chunk => {
                    htmlContent += `
                        <span 
                            id="ayah-${ayahData.surah}-${ayahData.ayah}" 
                            style="font-family: '${chunk.family}';"
                        >${chunk.text}</span>&#8203;
                    `;
                });
            });

            if (htmlContent !== '') {
                container.innerHTML = htmlContent;
                document.getElementById('pageNumDisplay').innerText = pageNumber;
                document.getElementById('surahNameDisplay').innerText = currentSurah;
                
                // تحديد الجزء برمجياً (تبسيط: كل 20 صفحة تقريباً جزء)
                const juz = Math.ceil(pageNumber / 20);
                document.getElementById('juzNameDisplay').innerText = `الجزء ${juz}`;
            }
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        fetchQuranData();
    </script>

</body>
</html>
