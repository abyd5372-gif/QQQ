<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - مطابق لمصحف المدينة</title>
    
    <!-- استدعاء ملف الخطوط الأصلي -->
    <link rel="stylesheet" href="fonts.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
        }

        /* لوحة التحكم وتقليب الصفحات */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            align-items: center;
        }

        button {
            background-color: #dab473;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            color: #4a3b22;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e8c78c;
        }

        /* إطار صفحة المصحف الورقي */
        .mushaf-wrapper {
            background-color: #fdfaf2;
            border: 3px solid #dab473;
            border-radius: 6px;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 0.63; /* النسبة القياسية لصفحة المصحف */
            padding: 3% 4%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ترويسة الصفحة (اسم السورة ورقم الجزء) */
        .mushaf-header {
            display: flex;
            justify-content: space-between;
            color: #b58c49;
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid #e8dfc8;
            padding-bottom: 4px;
        }

        /* متن الآيات (الـ 15 سطراً بانتظام تام) */
        .mushaf-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* توزيع دقيق للأسطر الـ 15 عمودياً */
            
            font-size: 23px;
            line-height: 1.7;
            text-align: justify;
            text-align-last: center;
            direction: rtl;
        }

        /* تذييل الصفحة (رقم الصفحة) */
        .mushaf-footer {
            display: flex;
            justify-content: center;
            border-top: 1px solid #e8dfc8;
            padding-top: 4px;
        }

        .page-number-frame {
            border: 1px solid #b58c49;
            border-radius: 15px;
            padding: 1px 25px;
            color: #b58c49;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- أزرار التنقل بين صفحات المصحف (1 إلى 604) -->
    <div class="controls">
        <button onclick="changePage(1)">الصفحة التالية &larr;</button>
        <span id="pageIndicator" style="color: white; font-weight: bold; font-size: 14px;">صفحة 1</span>
        <button onclick="changePage(-1)">&rarr; الصفحة السابقة</button>
    </div>

    <!-- حاوية صفحة المصحف -->
    <div class="mushaf-wrapper">
        
        <div class="mushaf-header">
            <span id="surahNameDisplay">الفاتحة</span>
            <span id="juzNameDisplay">الجزء الأول</span>
        </div>

        <div class="mushaf-body" id="quranContainer">
            <p style="text-align:center; color:#888;">جاري تحميل المصحف...</p>
        </div>

        <div class="mushaf-footer">
            <div class="page-number-frame" id="pageNumDisplay">1</div>
        </div>

    </div>

    <script>
        let quranData = null;
        let currentPage = 1; // تبدأ من الصفحة الأولى (الفاتحة)

        async function fetchQuranData() {
            try {
                const response = await fetch('quran-glyphs.json');
                quranData = await response.json();
                renderPage(currentPage);
            } catch (error) {
                console.error("خطأ في التحميل:", error);
                document.getElementById('quranContainer').innerHTML = "<p style='color:red; text-align:center;'>فشل تحميل البيانات</p>";
            }
        }

        function renderPage(pageNumber) {
            if (!quranData) return;

            const container = document.getElementById('quranContainer');
            let htmlContent = '';
            let detectedSurah = "القرآن الكريم";

            // المرور بترتيب الآيات الأصلي لضمان عدم انعكاس أو عشوائية الترتيب
            quranData.ayat.forEach(ayahData => {
                // تصفية الأجزاء التي تنتمي حصرياً لهذه الصفحة
                const pageChunks = ayahData.chunks.filter(chunk => chunk.p === pageNumber);
                
                if (pageChunks.length > 0) {
                    detectedSurah = `سورة رقم ${ayahData.surah}`;
                }

                pageChunks.forEach(chunk => {
                    // استخدام خط الصفحة المحدد بدقة من ملف الـ JSON
                    htmlContent += `
                        <span style="font-family: '${chunk.family}';">${chunk.text}</span>
                    `;
                });
            });

            if (htmlContent.trim() !== '') {
                container.innerHTML = htmlContent;
                document.getElementById('pageNumDisplay').innerText = pageNumber;
                document.getElementById('pageIndicator').innerText = `صفحة ${pageNumber}`;
                document.getElementById('surahNameDisplay').innerText = detectedSurah;
                
                // حساب الجزء بناءً على رقم الصفحة في مصحف المدينة
                const juz = Math.ceil(pageNumber / 20);
                document.getElementById('juzNameDisplay').innerText = `الجزء ${juz}`;
            } else {
                container.innerHTML = "<p style='text-align:center; color:#888;'>انتهت صفحات المصحف أو حدث خطأ في المطابقة.</p>";
            }
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        fetchQuranData();
    </script>

</body>
</html>
