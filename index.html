<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف تفاعلي - بصوت العفاسي</title>
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .controls {
            background: #fff;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background-color: #219150; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .page-info {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .quran-container {
            width: 100%;
            max-width: 800px;
            height: 80vh;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* نستخدم object لعرض الـ SVG كي نتمكن من التعديل عليه بـ JS */
        object {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="nextPage()">الصفحة التالية &lt;</button>
        <span class="page-info">صفحة: <span id="page-num">1</span></span>
        <button onclick="prevPage()">&gt; الصفحة السابقة</button>
        <button id="play-btn" onclick="toggleAudio()" style="background-color: #2980b9;">▶ تشغيل الصفحة</button>
    </div>

    <div class="quran-container">
        <!-- سيتم تحميل ملف الـ svgz هنا -->
        <object id="quran-svg" type="image/svg+xml" data="1.svgz"></object>
    </div>

    <script>
        let currentPage = 1;
        const totalPages = 604; // عدد صفحات المصحف
        let ayahsData = []; // بيانات الآيات للصفحة الحالية
        let currentAyahIndex = 0;
        let audioPlayer = new Audio();
        let isPlaying = false;

        const svgObject = document.getElementById('quran-svg');
        const pageNumDisplay = document.getElementById('page-num');
        const playBtn = document.getElementById('play-btn');

        // دالة لتحميل الصفحة (الصورة + بيانات الصوت)
        async function loadPage(page) {
            currentPage = page;
            pageNumDisplay.innerText = page;
            
            // 1. تحديث ملف الـ SVG
            svgObject.data = `${page}.svgz`;
            
            // إيقاف الصوت عند تغيير الصفحة
            stopAudio();

            try {
                // 2. جلب بيانات الآيات والصوت (العفاسي) لهذه الصفحة من الـ API
                const response = await fetch(`https://api.alquran.cloud/v1/page/${page}/ar.alafasy`);
                const data = await response.json();
                
                if(data.code === 200) {
                    ayahsData = data.data.ayahs;
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات الصوت:", error);
            }
        }

        // دوال تقليب الصفحات
        function nextPage() {
            if (currentPage < totalPages) loadPage(currentPage + 1);
        }

        function prevPage() {
            if (currentPage > 1) loadPage(currentPage - 1);
        }

        // تشغيل / إيقاف الصوت
        function toggleAudio() {
            if (isPlaying) {
                stopAudio();
            } else {
                if (ayahsData.length > 0) {
                    isPlaying = true;
                    playBtn.innerText = "⏸ إيقاف";
                    playBtn.style.backgroundColor = "#e74c3c";
                    currentAyahIndex = 0;
                    playAyah(currentAyahIndex);
                }
            }
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            isPlaying = false;
            playBtn.innerText = "▶ تشغيل الصفحة";
            playBtn.style.backgroundColor = "#2980b9";
            clearHighlight();
        }

        // تشغيل آية معينة
        function playAyah(index) {
            if (index >= ayahsData.length) {
                // انتهت الصفحة، ننتقل للتالية تلقائياً ونشغلها
                if (currentPage < totalPages) {
                    loadPage(currentPage + 1).then(() => toggleAudio());
                } else {
                    stopAudio();
                }
                return;
            }

            const ayah = ayahsData[index];
            audioPlayer.src = ayah.audio;
            audioPlayer.play();

            // تظليل الآية الحالية (رقم السورة ورقم الآية)
            highlightAyah(ayah.surah.number, ayah.numberInSurah);

            // عند انتهاء الآية، شغل التي تليها
            audioPlayer.onended = () => {
                currentAyahIndex++;
                playAyah(currentAyahIndex);
            };
        }

        // دالة تظليل الآية داخل الـ SVG
        function highlightAyah(surahNum, ayahNum) {
            const svgDoc = svgObject.contentDocument;
            if (!svgDoc) return; // تأكد أن الـ SVG تم تحميله

            clearHighlight(); // مسح التظليل السابق

            /* 
               ملاحظة هامة جداً:
               لكي يعمل التظليل، يجب أن تكون الكلمات في ملف الـ SVG مجمعة في وسم <g>
               وتمتلك معرّف ID محدد. في أغلب المصاحف الرقمية يكون المعرف بهذا الشكل:
               id="s1_a1" (سورة 1، آية 1) أو id="ayah_1_1"
               قم بتعديل السطر التالي ليتطابق مع تسمية الـ ID داخل ملفات الـ SVG لديك.
            */
            const expectedId = `s${surahNum}_a${ayahNum}`; 
            
            // محاولة البحث عن الآية في الـ SVG
            const ayahGroup = svgDoc.getElementById(expectedId);
            
            if (ayahGroup) {
                // حفظ اللون الأصلي لإرجاعه لاحقاً
                ayahGroup.dataset.originalFill = ayahGroup.style.fill;
                
                // تغيير لون الآية (مثلاً لون أزرق فاتح أو أخضر)
                ayahGroup.style.fill = "#2980b9"; 
            } else {
                console.warn(`لم يتم العثور على الآية ${expectedId} داخل الـ SVG`);
            }
        }

        // إزالة التظليل
        function clearHighlight() {
            const svgDoc = svgObject.contentDocument;
            if (!svgDoc) return;

            // البحث عن كل العناصر التي تم تعديل لونها وإعادتها
            const allAyahs = svgDoc.querySelectorAll('[data-original-fill]');
            allAyahs.forEach(el => {
                el.style.fill = el.dataset.originalFill;
                delete el.dataset.originalFill;
            });
        }

        // تحميل الصفحة الأولى عند فتح الموقع
        window.onload = () => loadPage(1);

    </script>
</body>
</html>
