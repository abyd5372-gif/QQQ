<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - التتبع الصوتي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            font-family: system-ui, sans-serif;
        }
        .mushaf-container {
            background-color: #FDF7E2;
            border: 10px solid #D4C3A3;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        /* تظليل الآية عند القراءة */
        .ayah-highlight {
            background-color: rgba(212, 175, 55, 0.4);
            border-radius: 4px;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-2">

    <!-- شريط التحكم العلوي -->
    <div class="w-full max-w-2xl bg-gray-900 text-white p-3 rounded-t-xl shadow-lg flex justify-between items-center border border-gray-700 mb-2">
        <button id="play-btn" onclick="togglePlay()" class="px-5 py-2 bg-green-600 hover:bg-green-500 font-bold rounded shadow">
            تشغيل العفاسي ▶
        </button>

        <div class="flex items-center gap-3 bg-gray-800 px-3 py-1.5 rounded">
            <button onclick="changePage(-1)" class="text-gray-300 hover:text-white font-bold">السابق</button>
            <span id="page-label" class="font-bold text-amber-400">صـ 2</span>
            <button onclick="changePage(1)" class="text-gray-300 hover:text-white font-bold">التالي</button>
        </div>
    </div>

    <!-- عرض صفحة المصحف عبر ملفات SVG الموجودة معك -->
    <div class="mushaf-container w-full max-w-2xl p-4 rounded-b-xl relative flex flex-col items-center">
        
        <!-- هنا سيتم عرض ملف الـ SVG الخاص بالصفحة (مثلاً 2.svgz) -->
        <div id="svg-view-container" class="w-full flex justify-center relative">
            <div class="text-amber-800 font-bold py-20">جاري تحميل صفحة المصحف...</div>
        </div>

    </div>

    <audio id="quran-audio" class="hidden"></audio>

    <script>
        const CLIENT_ID = '7e8ed480-bcca-4442-985e-7d45ac9cbc06';
        const CLIENT_SECRET = 'qfcs_74a0ff300e7b4b568b5724d8a60ae377ef801ab376a146c39a9606b3a7f5e104';

        let currentPage = 2; // ابدأ بصفحة 2 مثلاً
        let versesData = [];
        let isPlaying = false;
        let currentVerseIndex = 0;

        const svgContainer = document.getElementById('svg-view-container');
        const pageLabel = document.getElementById('page-label');
        const audioEl = document.getElementById('quran-audio');
        const playBtn = document.getElementById('play-btn');

        function loadPage(page) {
            stopAudio();
            pageLabel.innerText = 'صـ ' + page;
            svgContainer.innerHTML = '<div class="text-amber-800 font-bold py-20">جاري تحميل صفحة المصحف...</div>';

            // 1. جلب ملف الـ SVG المباشر من مجلدك على GitHub (مثلاً 2.svgz أو 2.svg)
            // ملاحظة: إذا كانت الملفات بصيغة svgz ضغطاً، قد تحتاج لفك ضغطها أو جلبها كـ object/embed
            const svgUrl = `./${page}.svgz`; 

            // نقوم بعرض ملف الـ SVG داخل عنصر <object> أو <embed> لضمان ظهوره كاملاً بكل أشكاله
            svgContainer.innerHTML = `
                <object data="${svgUrl}" type="image/svg+xml" class="w-full h-auto max-h-[75vh]">
                    متصفحك لا يدعم عرض ملفات المصحف.
                </object>
            `;

            // 2. جلب بيانات الآيات لنفس الصفحة من الـ API لتفعيل التتبع الصوتي والتظليل
            fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?page_number=${page}`, {
                headers: {
                    'Content-Type': 'application/json',
                    'x-client-id': CLIENT_ID,
                    'Authorization': `Bearer ${CLIENT_SECRET}`
                }
            })
            .then(res => res.json())
            .then(data => {
                versesData = data.verses || [];
            })
            .catch(err => console.error("خطأ في جلب الآيات:", err));
        }

        // دوال الصوت والتلاوة
        function togglePlay() {
            if (isPlaying) {
                stopAudio();
            } else {
                if (versesData.length > 0) playVerse();
            }
        }

        function playVerse() {
            if (currentVerseIndex >= versesData.length) {
                stopAudio();
                return;
            }

            isPlaying = true;
            playBtn.innerText = 'إيقاف ⏸';
            playBtn.className = 'px-5 py-2 bg-red-600 hover:bg-red-500 font-bold rounded shadow';

            const verseKey = versesData[currentVerseIndex].verse_key;

            fetch(`https://api.quran.com/api/v4/recitations/7/by_ayah/${verseKey}`)
                .then(res => res.json())
                .then(data => {
                    if (data.audio_files && data.audio_files.length > 0) {
                        let audioUrl = data.audio_files[0].url;
                        audioEl.src = audioUrl.startsWith('http') ? audioUrl : `https://verses.quran.com/${audioUrl}`;
                        audioEl.play();
                    }
                });
        }

        function stopAudio() {
            isPlaying = false;
            audioEl.pause();
            playBtn.innerText = 'تشغيل العفاسي ▶';
            playBtn.className = 'px-5 py-2 bg-green-600 hover:bg-green-500 font-bold rounded shadow';
        }

        audioEl.onended = () => {
            currentVerseIndex++;
            playVerse();
        };

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                currentVerseIndex = 0;
                loadPage(currentPage);
            }
        }

        // تشغيل الصفحة عند التحميل
        loadPage(currentPage);
    </script>
</body>
</html>
