<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - تلاوة العفاسي</title>
    <style>
        :root {
            --primary: #2c3e50;
            --bg: #f8f9fa;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* تصميم زجاجي أنيق لشريط التحكم */
        .controls-container {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 10;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #1a252f;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .page-info {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            min-width: 100px;
            text-align: center;
        }

        /* حاوية صفحة المصحف */
        .quran-page-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 10px;
        }

        /* نستخدم object بدلاً من img للتمكن من الوصول لعناصر الـ SVG لاحقاً */
        object {
            width: 100%;
            height: auto;
            pointer-events: none; /* لمنع التفاعل العشوائي مع محتوى الـ SVG */
        }
    </style>
</head>
<body>

    <div class="controls-container">
        <button id="nextPage">الصفحة التالية</button>
        <div class="page-info">صفحة <span id="pageNum">1</span></div>
        <button id="prevPage">الصفحة السابقة</button>
        <button id="playAudio">تشغيل الصوت 🎧</button>
    </div>

    <div class="quran-page-container">
        <object id="quranSvg" data="001.svg" type="image/svg+xml"></object>
    </div>

    <script>
        let currentPage = 1;
        let ayahsData = [];
        let currentAyahIndex = 0;
        let audioPlayer = new Audio();
        let isPlaying = false;

        const pageNumDisplay = document.getElementById('pageNum');
        const quranSvg = document.getElementById('quranSvg');
        const playBtn = document.getElementById('playAudio');

        // دالة لتنسيق رقم الصفحة (مثال: 001, 045, 604)
        function formatPageNumber(num) {
            return num.toString().padStart(3, '0');
        }

        // تحديث عرض الصفحة
        function updatePageDisplay() {
            const formattedNum = formatPageNumber(currentPage);
            quranSvg.data = `${formattedNum}.svg`; // يقوم بجلب الملف من نفس مسار الاستضافة
            pageNumDisplay.textContent = currentPage;
            
            // إيقاف الصوت عند تغيير الصفحة وتحضير بيانات الصفحة الجديدة
            stopAudio();
            fetchPageData(currentPage);
        }

        // جلب بيانات الآيات والصوت للصفحة الحالية من API
        async function fetchPageData(page) {
            try {
                playBtn.disabled = true;
                playBtn.textContent = 'جاري التحميل...';
                
                // جلب بيانات الصفحة بصوت العفاسي
                const response = await fetch(`https://api.alquran.cloud/v1/page/${page}/ar.alafasy`);
                const data = await response.json();
                
                if (data.code === 200) {
                    ayahsData = data.data.ayahs;
                    playBtn.disabled = false;
                    playBtn.textContent = 'تشغيل الصوت 🎧';
                }
            } catch (error) {
                console.error("حدث خطأ في جلب البيانات:", error);
                playBtn.textContent = 'خطأ في التحميل';
            }
        }

        // تشغيل صوت الآيات بالترتيب
        function playAyahSequence() {
            if (currentAyahIndex >= ayahsData.length) {
                stopAudio();
                return;
            }

            const currentAyah = ayahsData[currentAyahIndex];
            audioPlayer.src = currentAyah.audio;
            audioPlayer.play();
            isPlaying = true;
            playBtn.textContent = 'إيقاف ⏸️';

            // هنا تكمن منطقية "تتبع الآيات"
            highlightAyahInSvg(currentAyah.numberInSurah);

            audioPlayer.onended = () => {
                currentAyahIndex++;
                playAyahSequence();
            };
        }

        function stopAudio() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            isPlaying = false;
            currentAyahIndex = 0;
            playBtn.textContent = 'تشغيل الصوت 🎧';
            removeHighlightFromSvg();
        }

        // أزرار التحكم
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopAudio();
            } else {
                if (ayahsData.length > 0) playAyahSequence();
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage < 604) {
                currentPage++;
                updatePageDisplay();
            }
        });

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                updatePageDisplay();
            }
        });

        // -----------------------------------------------------
        // وظائف تتبع الآيات (تتطلب تجهيزاً مسبقاً لملفات الـ SVG)
        // -----------------------------------------------------
        function highlightAyahInSvg(ayahNum) {
            /* 
               ملاحظة هامة: 
               لكي يعمل التظليل داخل ملف الـ SVG (مثل 001.svg)، 
               يجب أن تكون الآيات داخل الملف مجمعة في وسوم (Tags) تمتلك معرفات (IDs).
               مثال: <g id="ayah-1"> ... مسارات الكلمات ... </g>
               
               إذا كانت ملفاتك مجهزة بهذه الطريقة، يمكنك تفعيل هذا الكود:
            */
            try {
                const svgDoc = quranSvg.contentDocument;
                if (!svgDoc) return;

                // إزالة التظليل السابق
                removeHighlightFromSvg(svgDoc);

                // البحث عن الآية الحالية وتظليلها (بافتراض أن الـ ID هو ayah-رقم)
                const targetAyah = svgDoc.getElementById(`ayah-${ayahNum}`);
                if (targetAyah) {
                    targetAyah.style.fill = '#2980b9'; // لون التظليل
                    targetAyah.classList.add('active-ayah');
                }
            } catch (e) {
                console.log("تعذر الوصول لمحتوى SVG، تأكد من أن الملفات على نفس النطاق (CORS).");
            }
        }

        function removeHighlightFromSvg(svgDoc = quranSvg.contentDocument) {
            if (!svgDoc) return;
            const activeElements = svgDoc.querySelectorAll('.active-ayah');
            activeElements.forEach(el => {
                el.style.fill = ''; // العودة للون الأصلي
                el.classList.remove('active-ayah');
            });
        }

        // التهيئة الأولية
        fetchPageData(currentPage);
    </script>
</body>
</html>
