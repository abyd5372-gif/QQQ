<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المصحف التفاعلي المتجهي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1d6f93;
            --highlight-color: #1a5fb4; /* لون تحديد خط الآية التفاعلي */
            --page-bg: #fffdf9;
            --primary-dark: #153448;
            --gold-accent: #c2a661;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #121212;
            font-family: 'Tajawal', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* حاوية المصحف بنسبة أبعاد الـ SVG الدقيقة (382.68 / 547.09) */
        .mushaf-container {
            position: relative;
            height: 98vh;
            aspect-ratio: 382.68 / 547.09;
            max-width: 96vw;
            background: var(--page-bg);
            box-shadow: 0 0 40px rgba(0,0,0,0.85);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* عرض ملف الـ SVG التفاعلي بكامل الحاوية */
        #svgWrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #svgWrapper svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* تفاعل عناصر الآيات داخل الـ SVG */
        #svgWrapper [data-surah][data-aya] {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* تظليل الآية النشطة بتغيير لون الحبر فورياً بدقة متناهية */
        #svgWrapper .active-ayah path,
        #svgWrapper path.active-ayah {
            fill: var(--highlight-color) !important;
            transition: fill 0.2s ease;
        }

        /* أزرار التقليب الشفافة */
        .turn-zone {
            position: absolute;
            top: 0; bottom: 0; width: 18%;
            z-index: 100; cursor: pointer;
        }
        .turn-next { left: 0; }
        .turn-prev { right: 0; }

        /* شريط التحكم السفلي بالآية */
        .action-bar {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(29, 111, 147, 0.3);
            border-radius: 18px;
            padding: 10px 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }
        .action-bar.show { bottom: 20px; }

        .action-bar-info { font-weight: 800; color: var(--primary-dark); font-size: 0.95rem; }
        .action-buttons { display: flex; gap: 6px; }

        .act-btn {
            border: none; background: #f0f4f7; color: var(--primary-dark);
            padding: 8px 12px; border-radius: 10px; font-family: 'Tajawal'; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.88rem;
            transition: 0.2s;
        }
        .act-btn:hover { background: var(--primary-blue); color: #fff; }
        .act-btn.close-btn { background: #fee; color: #c0392b; }

        /* زر الإعدادات العائم */
        .fab-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--gold-accent); color: #fff; border: none;
            font-size: 1.3rem; cursor: pointer; z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.35);
        }

        .settings-box {
            position: fixed; bottom: 82px; right: 20px; width: 280px;
            background: #fff; border-radius: 16px; padding: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); z-index: 998;
            display: none; flex-direction: column; gap: 10px;
        }
        .settings-box.show { display: flex; }
        .settings-box input, .settings-box select {
            padding: 9px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Tajawal'; font-size: 0.95rem;
        }

        /* نافذة التفسير */
        .tafsir-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; max-width: 480px; max-height: 65vh; background: #fff;
            border-radius: 16px; padding: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            z-index: 2000; display: none; flex-direction: column;
            border: 2px solid var(--gold-accent);
        }
        .tafsir-modal.show { display: flex; }
        .tafsir-body { overflow-y: auto; line-height: 1.8; font-size: 1.1rem; color: #333; margin-top: 10px; }

        .loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2.2rem; color: var(--gold-accent); z-index: 10;
        }

        .toast-notify {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
            background: rgba(29, 111, 147, 0.95); color: #fff;
            padding: 8px 22px; border-radius: 25px; font-weight: 700; font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); z-index: 10001;
            opacity: 0; transition: 0.3s; pointer-events: none;
        }
        .toast-notify.show { opacity: 1; }
    </style>
</head>
<body>

<div id="toast" class="toast-notify"></div>

<div class="mushaf-container">
    <div id="loader" class="loader"><i class="fa-solid fa-spinner fa-spin"></i></div>
    
    <!-- الحاوية التي يُحقن داخلها كود الـ SVG مباشرة -->
    <div id="svgWrapper"></div>

    <!-- مناطق التقليب بالنقر على الأطراف -->
    <div class="turn-zone turn-next" onclick="changePage(1)" title="الصفحة التالية"></div>
    <div class="turn-zone turn-prev" onclick="changePage(-1)" title="الصفحة السابقة"></div>
</div>

<!-- شريط التحكم بالآية المحددة -->
<div id="actionBar" class="action-bar">
    <div id="actionInfo" class="action-bar-info">سورة الفاتحة - آية 1</div>
    <div class="action-buttons">
        <button class="act-btn" onclick="playSelectedAyah()"><i class="fa-solid fa-play"></i> تلاوة</button>
        <button class="act-btn" onclick="openTafsir()"><i class="fa-solid fa-book-open"></i> تفسير</button>
        <button class="act-btn" onclick="copySelectedAyah()"><i class="fa-solid fa-copy"></i> نسخ</button>
        <button class="act-btn close-btn" onclick="deselectAyah()"><i class="fa-solid fa-xmark"></i></button>
    </div>
</div>

<!-- زر وقائمة الإعدادات -->
<button class="fab-btn" onclick="toggleSettings()"><i class="fa-solid fa-sliders"></i></button>

<div id="settingsBox" class="settings-box">
    <label style="font-weight: 800; color: var(--primary-dark);">انتقال لصفحة (1 - 604):</label>
    <div style="display: flex; gap: 8px;">
        <input type="number" id="pageJumpInput" min="1" max="604" value="1">
        <button class="act-btn" style="background: var(--primary-blue); color: #fff;" onclick="jumpToPage()">انتقال</button>
    </div>
    
    <label style="font-weight: 800; color: var(--primary-dark); margin-top: 6px;">القارئ:</label>
    <select id="reciterSelect">
        <option value="ar.alafasy">مشاري العفاسي</option>
        <option value="ar.husary">محمود خليل الحصري</option>
        <option value="ar.minshawi">محمد صديق المنشاوي</option>
    </select>
    
    <button class="act-btn" style="background: #e74c3c; color: #fff; justify-content: center; margin-top: 6px;" onclick="stopAudio()"><i class="fa-solid fa-stop"></i> إيقاف التلاوة</button>
</div>

<!-- نافذة التفسير -->
<div id="tafsirModal" class="tafsir-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 8px;">
        <h3 id="tafsirTitle" style="margin: 0; color: var(--primary-dark); font-size: 1.15rem;">التفسير الميسر</h3>
        <button onclick="closeTafsir()" style="border: none; background: none; font-size: 1.4rem; color: #c0392b; cursor: pointer;">&times;</button>
    </div>
    <div id="tafsirBody" class="tafsir-body"></div>
</div>

<script>
    let currentPage = 1;
    let selectedAyah = null; // { surah: 1, ayah: 1 }
    let audioPlayer = new Audio();

    function toArabicDigits(num) {
        return String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    window.onload = () => loadPage(currentPage);

    async function loadPage(pageNum) {
        document.getElementById('loader').style.display = 'block';
        deselectAyah();
        stopAudio();
        document.getElementById('pageJumpInput').value = pageNum;

        const p3 = String(pageNum).padStart(3, '0');
        const wrapper = document.getElementById('svgWrapper');

        // مسارات متوقعة للملف داخل المستودع
        const candidateUrls = [
            `svg/${p3}.svg`,
            `${p3}.svg`,
            `svg/${pageNum}.svg`,
            `${pageNum}.svg`
        ];

        let loaded = false;

        for (const url of candidateUrls) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const svgText = await res.text();
                    wrapper.innerHTML = svgText;
                    attachSvgEvents();
                    loaded = true;
                    showToast(`صفحة ${pageNum}`);
                    break;
                }
            } catch (e) {
                // المحاولة مع الرابط التالي
            }
        }

        if (!loaded) {
            wrapper.innerHTML = `<div style="padding: 20px; text-align: center; color: #c0392b; font-weight: bold;">
                يرجى التأكد من رفع ملف <b>${p3}.svg</b> إلى مستودع المشروع على GitHub.
            </div>`;
        }

        document.getElementById('loader').style.display = 'none';
    }

    // تفعيل أحداث النقر والتظليل التلقائي على عناصر الـ SVG
    function attachSvgEvents() {
        const wrapper = document.getElementById('svgWrapper');
        
        wrapper.querySelectorAll('[data-surah][data-aya]').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const s = parseInt(el.getAttribute('data-surah'), 10);
                const a = parseInt(el.getAttribute('data-aya'), 10);
                selectAyah(s, a);
            });
        });
    }

    function selectAyah(surahNum, ayahNum) {
        selectedAyah = { surah: surahNum, ayah: ayahNum };

        // إزالة التظليل السابق
        const wrapper = document.getElementById('svgWrapper');
        wrapper.querySelectorAll('.active-ayah').forEach(el => el.classList.remove('active-ayah'));

        // تظليل كافة الكلمات والرموز التابعة للآية في هذه الصفحة
        const s3 = String(surahNum).padStart(3, '0');
        const a3 = String(ayahNum).padStart(3, '0');

        const targets = wrapper.querySelectorAll(
            `[data-surah="${s3}"][data-aya="${a3}"], [data-surah="${surahNum}"][data-aya="${ayahNum}"]`
        );
        
        targets.forEach(el => el.classList.add('active-ayah'));

        document.getElementById('actionInfo').innerText = `سورة ${toArabicDigits(surahNum)} - آية ${toArabicDigits(ayahNum)}`;
        document.getElementById('actionBar').classList.add('show');
        document.getElementById('settingsBox').classList.remove('show');
    }

    function deselectAyah() {
        selectedAyah = null;
        const wrapper = document.getElementById('svgWrapper');
        wrapper.querySelectorAll('.active-ayah').forEach(el => el.classList.remove('active-ayah'));
        document.getElementById('actionBar').classList.remove('show');
    }

    function changePage(direction) {
        let target = currentPage - direction; // تقليب المصحف من اليمين لليسار
        if (target >= 1 && target <= 604) {
            currentPage = target;
            loadPage(currentPage);
        }
    }

    function jumpToPage() {
        let target = parseInt(document.getElementById('pageJumpInput').value);
        if (target >= 1 && target <= 604) {
            currentPage = target;
            loadPage(currentPage);
            document.getElementById('settingsBox').classList.remove('show');
        } else {
            alert("رقم الصفحة يجب أن يكون بين 1 و 604");
        }
    }

    function toggleSettings() {
        document.getElementById('settingsBox').classList.toggle('show');
    }

    async function playSelectedAyah() {
        if (!selectedAyah) return;
        const reciter = document.getElementById('reciterSelect').value;
        showToast("جارٍ بدء التلاوة...");

        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${selectedAyah.surah}:${selectedAyah.ayah}/${reciter}`);
            const data = await res.json();
            audioPlayer.src = data.data.audio;
            audioPlayer.play();
        } catch (e) {
            showToast("تعذر تشغيل الصوت.");
        }
    }

    function stopAudio() {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
    }

    async function openTafsir() {
        if (!selectedAyah) return;
        const modal = document.getElementById('tafsirModal');
        const body = document.getElementById('tafsirBody');
        
        modal.classList.add('show');
        body.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ تحميل التفسير...';

        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${selectedAyah.surah}:${selectedAyah.ayah}/ar.muyassar`);
            const data = await res.json();
            
            document.getElementById('tafsirTitle').innerText = `تفسير الآية ${toArabicDigits(selectedAyah.ayah)} من سورة ${data.data.surah.name}`;
            body.innerHTML = `<strong>نص الآية:</strong><br><span style="font-family:'Amiri'; font-size:1.35rem;">${data.data.text}</span><hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;"><strong>التفسير الميسر:</strong><br>${data.data.text}`;
        } catch (e) {
            body.innerHTML = "تعذر تحميل التفسير حالياً.";
        }
    }

    function closeTafsir() {
        document.getElementById('tafsirModal').classList.remove('show');
    }

    async function copySelectedAyah() {
        if (!selectedAyah) return;
        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${selectedAyah.surah}:${selectedAyah.ayah}/quran-uthmani`);
            const data = await res.json();
            navigator.clipboard.writeText(`${data.data.text} ﴿${toArabicDigits(selectedAyah.ayah)}﴾`)
                .then(() => showToast("تم نسخ الآية بنجاح!"));
        } catch (e) {
            showToast("تعذر النسخ.");
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.mushaf-container') && !e.target.closest('#actionBar') && !e.target.closest('#settingsBox') && !e.target.closest('.fab-btn')) {
            deselectAyah();
            document.getElementById('settingsBox').classList.remove('show');
        }
    });
</script>

</body>
</html>
