<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف المطابق للورقي - 15 سطر</title>
    
    <!-- استدعاء ملف الخطوط -->
    <link rel="stylesheet" href="fonts.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2c3e50; /* خلفية داكنة تبرز المصحف */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* منع التمرير ليكون بحجم الشاشة تماماً */
        }

        /* لوحة التحكم (الأزرار العلوية) */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 2vh;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
        }

        button {
            background-color: #dab473;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            color: #4a3b22;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #e8c78c;
        }

        /* 
          السحر هنا: تصميم صفحة المصحف 
          استخدام وحدة vh (طول الشاشة) يضمن أن الصفحة تتمدد وتتقلص 
          لتناسب أي شاشة (جوال، آيباد، لابتوب) دون أن تتشوه
        */
        .mushaf-page {
            background-color: #fdfaf2;
            border: 3px solid #dab473;
            border-radius: 5px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            
            /* أبعاد الصفحة لتطابق نسبة طول/عرض المصحف الحقيقي */
            height: 85vh; 
            aspect-ratio: 0.65; /* نسبة العرض للطول */
            padding: 3vh 2vh;
            
            /* إعدادات النص لضمان الـ 15 سطراً */
            display: flex;
            flex-direction: column;
            justify-content: center; /* توسيط الآيات عمودياً */
            
            font-size: 3.8vh; /* حجم الخط يتغير حسب طول الشاشة */
            line-height: 1.9;
            text-align: justify;
            text-align-last: center;
            direction: rtl;
            
            /* لمعالجة الرموز ومنعها من الخروج عن الإطار */
            word-wrap: break-word;
            word-break: normal; 
        }

        .page-number {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 1vh;
        }
    </style>
</head>
<body>

    <!-- أزرار التنقل بين الصفحات -->
    <div class="controls">
        <button onclick="changePage(1)">الصفحة التالية &larr;</button>
        <span id="pageIndicator" style="color: white; align-self: center; font-weight: bold;">جاري التحميل...</span>
        <button onclick="changePage(-1)">&rarr; الصفحة السابقة</button>
    </div>

    <!-- حاوية صفحة المصحف -->
    <div class="mushaf-page" id="quranContainer">
        <!-- سيتم حقن الآيات هنا -->
    </div>
    
    <div class="page-number" id="pageNumDisplay"></div>

    <script>
        let quranData = null;
        let currentPage = 1; // نبدأ من الفاتحة

        // 1. دالة لجلب البيانات مرة واحدة فقط عند تحميل الموقع
        async function fetchQuranData() {
            try {
                const response = await fetch('quran-glyphs.json');
                quranData = await response.json();
                renderPage(currentPage);
            } catch (error) {
                console.error("خطأ:", error);
                document.getElementById('quranContainer').innerHTML = "<p style='color:red;'>فشل التحميل</p>";
            }
        }

        // 2. دالة لطباعة الصفحة المطلوبة
        function renderPage(pageNumber) {
            if (!quranData) return;

            const container = document.getElementById('quranContainer');
            let htmlContent = '';
            let hasAyahs = false;

            // الدوران على كل الآيات والبحث عن التي تنتمي لهذه الصفحة
            quranData.ayat.forEach(ayahData => {
                const pageChunks = ayahData.chunks.filter(chunk => chunk.p === pageNumber);
                
                pageChunks.forEach(chunk => {
                    hasAyahs = true;
                    // الرمز &#8203; هو فاصل غير مرئي يسمح للمتصفح بكسر السطر بشكل صحيح عند نهايته
                    htmlContent += `
                        <span 
                            id="ayah-${ayahData.surah}-${ayahData.ayah}" 
                            style="font-family: '${chunk.family}';"
                        >${chunk.text}</span>&#8203; 
                    `;
                });
            });

            if (hasAyahs) {
                container.innerHTML = htmlContent;
                document.getElementById('pageIndicator').innerText = `صفحة ${pageNumber}`;
                document.getElementById('pageNumDisplay').innerText = pageNumber;
            } else {
                container.innerHTML = "<p style='text-align:center;'>الصفحة غير متوفرة</p>";
            }
        }

        // 3. دالة للتحكم بأزرار التقليب
        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                renderPage(currentPage);
            }
        }

        // تشغيل التحميل عند فتح الموقع
        fetchQuranData();
    </script>

</body>
</html>
