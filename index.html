<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف المدينة - التقنية الاحترافية (QCF)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #262626;
        }
        
        /* تحميل الخط من رابط الـ CDN المفتوح لتجاوز حظر المتصفح */
        @font-face {
            font-family: 'p2';
            src: url('https://cdn.qurancdn.com/custom-fonts/quran/hafs/v1/woff2/p2.woff2') format('woff2');
            font-display: swap;
        }

        .quran-page-2 {
            font-family: 'p2', sans-serif;
            font-size: 2.5rem; 
            line-height: 1.7;
            color: #1a1a1a;
        }

        .mushaf-paper {
            background-color: #FDF7E2;
            border: 12px solid #D4C3A3;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .word {
            cursor: pointer;
            transition: all 0.2s;
        }

        .word:hover {
            color: #8B0000;
            background-color: rgba(212, 175, 55, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10 px-4">

    <div class="mushaf-paper p-4 md:p-8 w-full max-w-2xl shadow-2xl rounded-sm">
        <div id="quran-container" class="quran-page-2">
            <div class="text-xl font-sans text-center text-amber-700">جاري تحميل الصفحة الاحترافية والخط...</div>
        </div>
    </div>

    <script>
        fetch('https://api.quran.com/api/v4/verses/by_page/2?words=true&word_fields=code_v1,line_number')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('quran-container');
                container.innerHTML = ''; 

                let currentLine = 1;
                let lineDiv = document.createElement('div');
                
                lineDiv.className = "flex justify-between items-center w-full";
                
                data.verses.forEach(verse => {
                    verse.words.forEach(word => {
                        if (word.line_number !== currentLine) {
                            container.appendChild(lineDiv);
                            lineDiv = document.createElement('div');
                            
                            // توسيط السطر الأخير أو الأول إذا كانت الكلمات قليلة
                            if (currentLine === 15 || currentLine === 1) {
                                lineDiv.className = "flex justify-center gap-4 w-full";
                            } else {
                                lineDiv.className = "flex justify-between items-center w-full";
                            }
                            
                            currentLine = word.line_number;
                        }

                        const wordSpan = document.createElement('span');
                        wordSpan.className = 'word';
                        wordSpan.innerHTML = word.code_v1; 
                        
                        lineDiv.appendChild(wordSpan);
                    });
                });
                
                container.appendChild(lineDiv);
            })
            .catch(err => console.error("Error:", err));
    </script>
</body>
</html>
