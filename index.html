<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصحف تفاعلي كامل بالزخرفة</title>
    <style>
        .mushaf-page {
            position: relative;
            width: 500px;
            height: 715px; /* الأبعاد المتناسبة مع مصحف المدينة */
            /* 1. استدعاء صفحة المصحف الكاملة بزخرفتها كخلفية */
            background-image: url('https://githubusercontent.com');
            background-size: 100% 100%;
        }
        
        .interactive-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        /* المضلعات التفاعلية لكل آية (تكون شفافة تماماً في الوضع الطبيعي) */
        .ayahPolygon {
            fill: transparent;
            cursor: pointer;
            pointer-events: auto;
            transition: fill 0.2s ease;
        }
        
        /* تأثير التتبع والتظليل عند مرور الماوس أو التحديد البرمجي */
        .ayahPolygon:hover,
        .ayahPolygon.active {
            fill: rgba(0, 150, 136, 0.3); /* لون التظليل الأخضر الشفاف للآية */
        }
    </style>
</head>
<body>

    <div class="mushaf-page">
        <!-- 2. طبقة الـ SVG التفاعلية المأخوذة من إحداثيات المستودع الجاهزة -->
        <svg class="interactive-layer" viewBox="0 0 1000 1430">
            <!-- مثال لمضلع جاهز لآية مأخوذ من ملفات JSON الخاصة بالمستودع -->
            <polygon class="ayahPolygon" data-surah="1" data-ayah="1" points="150,120 850,120 850,200 150,200"></polygon>
            <polygon class="ayahPolygon" data-surah="1" data-ayah="2" points="150,200 850,200 850,280 150,280"></polygon>
        </svg>
    </div>

    <script>
        // كود بسيط لالتقاط الآية التي ينقر عليها المستخدم لتشغيل الصوت أو التفسير
        document.querySelectorAll('.ayahPolygon').forEach(ayah => {
            ayah.addEventListener('click', function() {
                // إزالة التظليل عن الآية السابقة
                document.querySelectorAll('.ayahPolygon').forEach(el => el.classList.remove('active'));
                
                // تظليل الآية الحالية
                this.classList.add('active');
                
                alert(`قمت بالنقر على السورة رقم: ${this.dataset.surah} ، الآية رقم: ${this.dataset.ayah}`);
            });
        });
    </script>

</body>
</html>
