<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصحف المدينة المنورة - مجمع الملك فهد</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Amiri&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2c6382;
            --highlight-color: #cde2f0; /* نفس لون التظليل في مصحف المدينة الإلكتروني */
            --frame-gold: #c2a661;
            --page-bg: #fffef9;
            --primary-dark: #153448;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1a1a1a;
            font-family: 'Tajawal', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* إطار صفحة المصحف بنسبة أبعاد المصحف الشريف الرسمية */
        .mushaf-wrapper {
            position: relative;
            height: 98vh;
            aspect-ratio: 1024 / 1656;
            max-width: 96vw;
            background: var(--page-bg);
            box-shadow: 0 0 35px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            border: 12px solid #e9dfc4;
            outline: 2px solid var(--frame-gold);
            outline-offset: -6px;
            box-sizing: border-box;
            padding: 10px 18px;
        }

        /* ترويسة الصفحة (اسم السورة ورقم الجزء) */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Amiri', serif;
            font-size: 1.15rem;
            font-weight: bold;
            color: #222;
            border-bottom: 1.5px solid var(--frame-gold);
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        /* حاوية الأسطر الـ 15 */
        .page-lines-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            user-select: none;
        }

        /* سطر المصحف مضبوط بالكامل كالصفحة المطبوعة */
        .quran-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            line-height: 1;
            direction: rtl;
        }

        /* كلمة المصحف المستدعاة من خط مجمع الملك فهد */
        .q-word {
            display: inline-block;
            cursor: pointer;
            transition: background 0.15s;
            padding: 2px 0;
            border-radius: 2px;
        }

        /* تظليل الآية بدقة تامة */
        .q-word.active {
            background-color: var(--highlight-color);
        }

        /* ترويسة السور والبسملة في الصفحات التي تبدأ بسورة جديدة */
        .surah-header-banner {
            background: #f7f3e8;
            border: 2px solid var(--frame-gold);
            border-radius: 6px;
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            font-weight: bold;
            color: #111;
            padding: 4px 0;
            margin: 4px 0;
        }

        .bismillah-text {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.35rem;
            margin: 4px 0;
            color: #000;
        }

        /* رقم الصفحة بالأسفل */
        .page-footer {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            border-top: 1.5px solid var(--frame-gold);
            padding-top: 3px;
            margin-top: 4px;
        }

        /* أزرار التقليب غير المرئية */
        .turn-zone {
            position: absolute;
            top: 0; bottom: 0; width: 18%;
            z-index: 100; cursor: pointer;
        }
        .turn-next { left: 0; }
        .turn-prev { right: 0; }

        /* شريط التحكم السفلي عند النقر على آية */
        .action-bar {
            position: fixed;
            bottom: -90px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(44, 99, 130, 0.3);
            border-radius: 16px;
            padding: 10px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: bottom 0.3s ease;
        }
        .action-bar.show { bottom: 20px; }

        .action-bar-info { font-weight: 800; color: var(--primary-dark); font-size: 0.95rem; }
        .action-buttons { display: flex; gap: 6px; }
        .act-btn {
            border: none; background: #f0f4f7; color: var(--primary-dark);
            padding: 8px 12px; border-radius: 8px; font-family: 'Tajawal'; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.88rem;
        }
        .act-btn:hover { background: var(--primary-blue); color: #fff; }
        .act-btn.close-btn { background: #fee; color: #c0392b; }

        /* زر الفهرس والقائمة العائمة */
        .fab-btn {
            position: fixed; bottom: 22px; right: 22px;
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--primary-blue); color: #fff; border: none;
            font-size: 1.3rem; cursor: pointer; z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .controls-modal {
            position: fixed; bottom: 85px; right: 22px; width: 280px;
            background: #fff; border-radius: 14px; padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 998;
            display: none; flex-direction: column; gap: 10px;
        }
        .controls-modal.show { display: flex; }
        .controls-modal input, .controls-modal select {
            padding: 9px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Tajawal'; font-size: 0.95rem;
        }

        /* نافذة التفسير */
        .tafsir-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; max-width: 480px; max-height: 65vh; background: #fff;
            border-radius: 16px; padding: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            z-index: 2000; display: none; flex-direction: column;
            border: 2px solid var(--frame-gold);
        }
        .tafsir-modal.show { display: flex; }
        .tafsir-content { overflow-y: auto; line-height: 1.8; font-size: 1.1rem; color: #333; margin-top: 10px; }

        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; color: var(--frame-gold); }
    </style>
</head>
<body>

<div class="mushaf-wrapper">
    <div id="loader" class="loader"><i class="fa-solid fa-spinner fa-spin"></i></div>
    
    <div class="page-header">
        <span id="surahHeaderName">سورة الفاتحة</span>
        <span id="juzHeaderNumber">الجزء ١</span>
    </div>

    <!-- 15 سطراً مطابقة للمصحف الشريف بالمليمتر -->
    <div id="pageLinesContainer" class="page-lines-container"></div>

    <div class="page-footer">
        <span id="pageFooterNumber">١</span>
    </div>

    <div class="turn-zone turn-next" onclick="changePage(1)" title="الصفحة التالية"></div>
    <div class="turn-zone turn-prev" onclick="changePage(-1)" title="الصفحة السابقة"></div>
</div>

<!-- شريط التحكم بالآية -->
<div id="actionBar" class="action-bar">
    <div id="actionAyahInfo" class="action-bar-info">سورة الفاتحة - آية 1</div>
    <div class="action-buttons">
        <button class="act-btn" onclick="playCurrentAyah()"><i class="fa-solid fa-play"></i> تلاوة</button>
        <button class="act-btn" onclick="showTafsir()"><i class="fa-solid fa-book-open"></i> تفسير</button>
        <button class="act-btn" onclick="copyAyah()"><i class="fa-solid fa-copy"></i> نسخ</button>
        <button class="act-btn close-btn" onclick="deselectAyah()"><i class="fa-solid fa-xmark"></i></button>
    </div>
</div>

<!-- زر التنقل العائم -->
<button class="fab-btn" onclick="toggleControls()"><i class="fa-solid fa-sliders"></i></button>

<div id="controlsModal" class="controls-modal">
    <label style="font-weight: bold;">رقم الصفحة (1 - 604):</label>
    <div style="display: flex; gap: 8px;">
        <input type="number" id="pageJumpInput" min="1" max="604" value="1">
        <button class="act-btn" style="background: var(--primary-blue); color: #fff;" onclick="jumpToPage()">انتقال</button>
    </div>
    <label style="font-weight: bold; margin-top: 5px;">القارئ:</label>
    <select id="reciterSelect">
        <option value="ar.alafasy">مشاري العفاسي</option>
        <option value="ar.husary">محمود خليل الحصري</option>
        <option value="ar.minshawi">محمد صديق المنشاوي</option>
    </select>
    <button class="act-btn" style="background: #e74c3c; color: #fff; justify-content: center; margin-top: 5px;" onclick="stopAudio()"><i class="fa-solid fa-stop"></i> إيقاف التلاوة</button>
</div>

<!-- نافذة التفسير الميسر -->
<div id="tafsirModal" class="tafsir-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px;">
        <h3 id="tafsirTitle" style="margin: 0; color: var(--primary-dark);">التفسير الميسر</h3>
        <button onclick="closeTafsir()" style="border: none; background: none; font-size: 1.4rem; color: #c0392b; cursor: pointer;">&times;</button>
    </div>
    <div id="tafsirContent" class="tafsir-content"></div>
</div>

<script>
    let currentPage = 1;
    let selectedAyahKey = null; // مثال: "1:2"
    let loadedPagesCache = {};
    let audioPlayer = new Audio();

    function toArabicNum(num) {
        return String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    window.onload = () => loadPage(currentPage);

    // تحميل الخط الحاسوبي الرسمي لصفحة معينة من مجمع الملك فهد
    async function loadPageFont(pageNum) {
        const fontName = `QCF_P${String(pageNum).padStart(3, '0')}`;
        if (!document.fonts.check(`12px ${fontName}`)) {
            const fontUrl = `https://static.quran.com/fonts/quran/hafs/v1/woff2/p${pageNum}.woff2`;
            const fontFace = new FontFace(fontName, `url(${fontUrl})`);
            await fontFace.load();
            document.fonts.add(fontFace);
        }
        return fontName;
    }

    // جلب بيانات الصفحة والأسطر الـ 15 من API الرسمية
    async function loadPage(pageNum) {
        document.getElementById('loader').style.display = 'block';
        deselectAyah();
        stopAudio();

        try {
            const fontName = await loadPageFont(pageNum);
            
            let pageData = loadedPagesCache[pageNum];
            if (!pageData) {
                // جلب مصفوفة كلمات الصفحة مقسمة حسب خطوط الرسم العثماني
                const res = await fetch(`https://api.quran.com/api/v4/verses/by_page/${pageNum}?words=true&word_fields=code_v1,line_number`);
                pageData = await res.json();
                loadedPagesCache[pageNum] = pageData;
            }

            renderPage(pageData, fontName, pageNum);
        } catch (e) {
            console.error(e);
            alert("تعذر تحميل الصفحة. يرجى التحقق من اتصال الإنترنت.");
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    function renderPage(pageData, fontName, pageNum) {
        const container = document.getElementById('pageLinesContainer');
        container.innerHTML = '';

        const verses = pageData.verses;
        const firstVerse = verses[0];
        const surahId = firstVerse.verse_key.split(':')[0];

        // تحديث الترويسة والفوتر
        document.getElementById('pageFooterNumber').innerText = toArabicNum(pageNum);
        document.getElementById('juzHeaderNumber').innerText = `الجزء ${toArabicNum(firstVerse.juz_number)}`;
        
        // تجميع الكلمات حسب رقم السطر في الصفحة (1 إلى 15)
        const linesMap = {};
        verses.forEach(v => {
            v.words.forEach(w => {
                const lineNum = w.line_number;
                if (!linesMap[lineNum]) linesMap[lineNum] = [];
                linesMap[lineNum].push({ ...w, ayahKey: v.verse_key });
            });
        });

        // الصفحات 1 و 2 لهما زخارف وتنسيق خاص لبداية الفاتحة والبقرة
        if (pageNum === 1 || pageNum === 2) {
            const banner = document.createElement('div');
            banner.className = 'surah-header-banner';
            banner.innerText = pageNum === 1 ? 'سورة الفاتحة' : 'سورة البقرة';
            container.appendChild(banner);

            const bismillah = document.createElement('div');
            bismillah.className = 'bismillah-text';
            bismillah.innerText = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
            container.appendChild(bismillah);
        }

        // بناء الأسطر وتوزيع الكلمات
        Object.keys(linesMap).sort((a,b) => a - b).forEach(lineNum => {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'quran-line';
            lineDiv.style.fontFamily = fontName;

            linesMap[lineNum].forEach(word => {
                const span = document.createElement('span');
                span.className = 'q-word';
                span.dataset.ayah = word.ayahKey;
                span.innerHTML = word.code_v1;
                span.onclick = (e) => {
                    e.stopPropagation();
                    selectAyah(word.ayahKey);
                };
                lineDiv.appendChild(span);
            });

            container.appendChild(lineDiv);
        });

        // استخراج اسم السورة للصفحة
        fetch(`https://api.quran.com/api/v4/chapters/${surahId}`)
            .then(res => res.json())
            .then(d => {
                document.getElementById('surahHeaderName').innerText = `سُورَةُ ${d.chapter.name_arabic}`;
            });
    }

    // تظليل الآية بدقة كاملة عند الضغط على أي كلمة فيها
    function selectAyah(ayahKey) {
        selectedAyahKey = ayahKey;

        // إزالة أي تظليل سابق
        document.querySelectorAll('.q-word').forEach(w => w.classList.remove('active'));

        // تظليل جميع كلمات الآية في كافة الأسطر التي تمتد عليها
        document.querySelectorAll(`.q-word[data-ayah="${ayahKey}"]`).forEach(w => w.classList.add('active'));

        const [s, a] = ayahKey.split(':');
        document.getElementById('actionAyahInfo').innerText = `آية ${toArabicNum(a)}`;
        document.getElementById('actionBar').classList.add('show');
    }

    function deselectAyah() {
        selectedAyahKey = null;
        document.querySelectorAll('.q-word').forEach(w => w.classList.remove('active'));
        document.getElementById('actionBar').classList.remove('show');
    }

    function changePage(delta) {
        const next = currentPage - delta; // اليمين سابق، واليسار تالٍ في العربية
        if (next >= 1 && next <= 604) {
            currentPage = next;
            document.getElementById('pageJumpInput').value = next;
            loadPage(currentPage);
        }
    }

    function jumpToPage() {
        const p = parseInt(document.getElementById('pageJumpInput').value);
        if (p >= 1 && p <= 604) {
            currentPage = p;
            loadPage(currentPage);
            toggleControls();
        }
    }

    function toggleControls() {
        document.getElementById('controlsModal').classList.toggle('show');
    }

    // تشغيل تلاوة الآية المحددة بالصوت
    async function playCurrentAyah() {
        if (!selectedAyahKey) return;
        const reciter = document.getElementById('reciterSelect').value;
        const [s, a] = selectedAyahKey.split(':');
        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/${reciter}`);
            const d = await res.json();
            audioPlayer.src = d.data.audio;
            audioPlayer.play();
        } catch (e) {
            alert("تعذر تشغيل الصوت.");
        }
    }

    function stopAudio() {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
    }

    // جلب التفسير الميسر للآية
    async function showTafsir() {
        if (!selectedAyahKey) return;
        const [s, a] = selectedAyahKey.split(':');
        document.getElementById('tafsirModal').classList.add('show');
        document.getElementById('tafsirContent').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ تحميل التفسير...';
        
        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/ar.muyassar`);
            const d = await res.json();
            document.getElementById('tafsirTitle').innerText = `تفسير آية ${toArabicNum(a)} (${d.data.surah.name})`;
            document.getElementById('tafsirContent').innerHTML = `<strong>نص الآية:</strong><br><span style="font-family:'Amiri'; font-size:1.3rem;">${d.data.text}</span><hr style="border:0; border-top:1px solid #eee; margin:10px 0;"><strong>التفسير الميسر:</strong><br>${d.data.text}`;
        } catch (e) {
            document.getElementById('tafsirContent').innerText = "تعذر تحميل التفسير.";
        }
    }

    function closeTafsir() {
        document.getElementById('tafsirModal').classList.remove('show');
    }

    // نسخ الآية بالرسم العثماني
    async function copyAyah() {
        if (!selectedAyahKey) return;
        const [s, a] = selectedAyahKey.split(':');
        const res = await fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`);
        const d = await res.json();
        navigator.clipboard.writeText(`${d.data.text} ﴿${toArabicNum(a)}﴾`);
        alert("تم نسخ الآية بنجاح!");
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.mushaf-wrapper') && !e.target.closest('.action-bar') && !e.target.closest('.controls-modal') && !e.target.closest('.fab-btn')) {
            deselectAyah();
            document.getElementById('controlsModal').classList.remove('show');
        }
    });
</script>

</body>
</html>
