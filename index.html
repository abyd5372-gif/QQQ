<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف التفاعلي - دعم SVG المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #1a1a1a;
            font-family: system-ui, sans-serif;
        }
        .mushaf-container {
            background-color: #FDF7E2;
            border: 12px solid #D4C3A3;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        /* كلاس التظليل للآية داخل ملف SVG */
        .active-ayah {
            fill: #8B0000 !important;
            background-color: rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-2">

    <!-- شريط التحكم العلوي -->
    <div class="w-full max-w-2xl bg-gray-900 text-white p-3 rounded-t-xl shadow-lg flex justify-between items-center border border-gray-700 mb-2">
        <button id="play-btn" onclick="togglePlay()" class="px-5 py-2 bg-green-600 hover:bg-green-500 font-bold rounded shadow">
            تشغيل العفاسي ▶
        </button>

        <div class="flex items-center gap-3 bg-gray-800 px-3 py-1.5 rounded">
            <button onclick="changePage(-1)" class="text-gray-300 hover:text-white font-bold">السابق</button>
            <span id="page-label" class="font-bold text-amber-400">صـ 2</span>
            <button onclick="changePage(1)" class="text-gray-300 hover:text-white font-bold">التالي</button>
        </div>
    </div>

    <!-- إطار عرض المصحف عبر SVG -->
    <div class="mushaf-container w-full max-w-2xl p-4 rounded-b-xl relative flex flex-col items-center">
        <div id="svg-wrapper" class="w-full overflow-hidden flex justify-center">
            <div class="text-amber-800 font-bold py-20">جاري تحميل صفحة المصحف...</div>
        </div>
    </div>

    <audio id="quran-audio" class="hidden"></audio>

    <script>
        const CLIENT_ID = '7e8ed480-bcca-4442-985e-7d45ac9cbc06';
        const CLIENT_SECRET = 'qfcs_74a0ff300e7b4b568b5724d8a60ae377ef801ab376a146c39a9606b3a7f5e104';

        let currentPage = 2;
        let versesData = [];
        let isPlaying = false;
        let currentVerseIndex = 0;

        const svgWrapper = document.getElementById('svg-wrapper');
        const pageLabel = document.getElementById('page-label');
        const audioEl = document.getElementById('quran-audio');
        const playBtn = document.getElementById('play-btn');

        async function loadPage(page) {
            stopAudio();
            pageLabel.innerText = 'صـ ' + page;
            svgWrapper.innerHTML = '<div class="text-amber-800 font-bold py-20">جاري تحميل صفحة المصحف...</div>';

            try {
                // 1. جلب محتوى ملف الـ SVG مباشرة (بما أنه موجود في المستودع)
                const svgRes = await fetch(`./${page}.svgz`); // أو ${page}.svg حسب امتداد ملفاتك الفعلية
                const svgText = await svgRes.text();
                svgWrapper.innerHTML = svgText;

                // 2. جلب بيانات الآيات للتحكم بالتظليل والصوت
                const apiRes = await fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?page_number=${page}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'x-client-id': CLIENT_ID,
                        'Authorization': `Bearer ${CLIENT_SECRET}`
                    }
                });
                const apiData = await apiRes.json();
                versesData = apiData.verses || [];

            } catch (err) {
                svgWrapper.innerHTML = '<div class="text-red-600 font-bold py-20">فشل تحميل ملف الصفحة.</div>';
                console.error(err);
            }
        }

        function togglePlay() {
            if (isPlaying) {
                stopAudio();
            } else {
                if (versesData.length > 0) playVerse();
            }
        }

        function playVerse() {
            if (currentVerseIndex >= versesData.length) {
                stopAudio();
                return;
            }

            isPlaying = true;
            playBtn.innerText = 'إيقاف ⏸';
            playBtn.className = 'px-5 py-2 bg-red-600 hover:bg-red-500 font-bold rounded shadow';

            const verseKey = versesData[currentVerseIndex].verse_key;
            highlightVerse(verseKey);

            fetch(`https://api.quran.com/api/v4/recitations/7/by_ayah/${verseKey}`)
                .then(res => res.json())
                .then(data => {
                    if (data.audio_files && data.audio_files.length > 0) {
                        let audioUrl = data.audio_files[0].url;
                        audioEl.src = audioUrl.startsWith('http') ? audioUrl : `https://verses.quran.com/${audioUrl}`;
                        audioEl.play();
                    }
                });
        }

        function stopAudio() {
            isPlaying = false;
            audioEl.pause();
            playBtn.innerText = 'تشغيل العفاسي ▶';
            playBtn.className = 'px-5 py-2 bg-green-600 hover:bg-green-500 font-bold rounded shadow';
            highlightVerse('');
        }

        function highlightVerse(verseKey) {
            // إزالة التظليل السابق داخل الـ SVG
            svgWrapper.querySelectorAll('.active-ayah').forEach(el => el.classList.remove('active-ayah'));
            
            if (verseKey) {
                // ملاحظة: ملفات SVG الخاصة بالقرآن عادة تربط العناصر بمعرفات (IDs) تحاكي أرقام الآيات أو السور
                // يمكنك هنا استهداف العنصر المناسب داخل الـ SVG بناءً على بنية ملفاتك
                const [surah, ayah] = verseKey.split(':');
                const targetElement = svgWrapper.querySelector(`#v-${surah}-${ayah}`) || svgWrapper.querySelector(`[data-verse="${verseKey}"]`);
                if (targetElement) {
                    targetElement.classList.add('active-ayah');
                }
            }
        }

        audioEl.onended = () => {
            currentVerseIndex++;
            playVerse();
        };

        function changePage(step) {
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= 604) {
                currentPage = newPage;
                currentVerseIndex = 0;
                loadPage(currentPage);
            }
        }

        loadPage(currentPage);
    </script>
</body>
</html>
