<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مصحف المدينة المنورة - كامل الصفحات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2c6382;
            --highlight-color: rgba(94, 172, 211, 0.4); /* نفس تظليل الهايلايتر في مشروع آيات */
            --primary-dark: #153448;
            --gold-accent: #d4af37;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #121212;
            font-family: 'Tajawal', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* حاوية المصحف بنسب أبعاد صور مصحف المدينة الرسمية */
        .mushaf-container {
            position: relative;
            height: 100vh;
            aspect-ratio: 1920 / 3105;
            max-width: 100vw;
            background: #fff;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mushaf-image {
            width: 100%; height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
            image-rendering: -webkit-optimize-contrast;
        }

        /* طبقة التظليل فوق الصورة الحقيقية */
        .lines-overlay {
            position: absolute;
            top: 8.8%; /* بداية أسطر النص داخل الإطار */
            bottom: 8.6%; /* نهاية الأسطر قبل رقم الصفحة */
            right: 8.5%; /* الهامش الأيمن */
            left: 8.5%; /* الهامش الأيسر */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* سطر من أسطر المصحف الـ 15 */
        .mushaf-line-box {
            width: 100%;
            height: 5.6%;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* التظليل المندمج مع الحبر الأسود */
        .mushaf-line-box.active {
            background-color: var(--highlight-color);
            mix-blend-mode: multiply;
        }

        /* مناطق التقليب بالنقر على الأطراف */
        .turn-btn {
            position: absolute;
            top: 0; height: 100%; width: 15%;
            z-index: 20; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.2s;
            color: rgba(255,255,255,0.6); font-size: 2.5rem;
            background: rgba(0,0,0,0.02);
        }
        .turn-btn:active { opacity: 1; background: rgba(0,0,0,0.06); }
        .turn-next { left: 0; }
        .turn-prev { right: 0; }

        /* شريط التحكم السفلي بالآية */
        .ayah-action-bar {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(44, 99, 130, 0.25);
            border-radius: 16px;
            padding: 10px 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
        }
        .ayah-action-bar.show { bottom: 20px; }

        .ayah-info-text { font-weight: 800; color: var(--primary-dark); font-size: 0.95rem; }
        .ayah-btn-group { display: flex; gap: 6px; }
        
        .act-btn {
            border: none; background: #f0f4f7; color: var(--primary-dark);
            padding: 8px 12px; border-radius: 8px; font-family: 'Tajawal'; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.88rem;
            transition: 0.2s;
        }
        .act-btn:hover { background: var(--primary-blue); color: #fff; }
        .act-btn.close { background: #fee; color: #c0392b; }

        /* زر الإعدادات العائم */
        .fab-settings {
            position: fixed; bottom: 20px; right: 20px;
            width: 52px; height: 52px; border-radius: 50%;
            background: var(--gold-accent); color: #fff; border: none;
            font-size: 1.3rem; cursor: pointer; z-index: 999;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .settings-dialog {
            position: fixed; bottom: 82px; right: 20px; width: 280px;
            background: #fff; border-radius: 14px; padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 998;
            display: none; flex-direction: column; gap: 10px;
        }
        .settings-dialog.show { display: flex; }
        .settings-dialog input, .settings-dialog select {
            padding: 9px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Tajawal'; font-size: 0.95rem;
        }

        /* نافذة التفسير الميسر */
        .tafsir-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; max-width: 480px; max-height: 65vh; background: #fff;
            border-radius: 16px; padding: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            z-index: 2000; display: none; flex-direction: column;
            border: 2px solid var(--gold-accent);
        }
        .tafsir-modal.show { display: flex; }
        .tafsir-scroll { overflow-y: auto; line-height: 1.8; font-size: 1.1rem; color: #333; margin-top: 10px; }

        .loading-spin {
            position: absolute; font-size: 2.2rem; color: var(--gold-accent); z-index: 5;
        }

        .toast-box {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
            background: rgba(44, 99, 130, 0.95); color: #fff;
            padding: 8px 22px; border-radius: 25px; font-weight: 700; font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25); z-index: 10001;
            opacity: 0; transition: 0.3s; pointer-events: none;
        }
        .toast-box.show { opacity: 1; }
    </style>
</head>
<body>

<div id="toast" class="toast-box"></div>

<!-- حاوية المصحف (صورة حقيقية + شبكة أسطر تفاعلية) -->
<div class="mushaf-container" id="mushafContainer">
    <div id="loader" class="loading-spin"><i class="fa-solid fa-spinner fa-spin"></i></div>
    
    <!-- صورة المصحف فائقة الدقة (Full HD) -->
    <img id="mushafImage" src="" class="mushaf-image" alt="صفحة المصحف">
    
    <!-- شبكة الأسطر الـ 15 المتطابقة مع أسطر المصحف للتظليل الدقيق -->
    <div class="lines-overlay" id="linesOverlay"></div>

    <!-- أزرار التقليب -->
    <div class="turn-btn turn-next" onclick="changePage(1)" title="الصفحة التالية"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="turn-btn turn-prev" onclick="changePage(-1)" title="الصفحة السابقة"><i class="fa-solid fa-chevron-right"></i></div>
</div>

<!-- شريط التحكم السفلي بالآية -->
<div id="actionBar" class="ayah-action-bar">
    <div id="actionInfo" class="ayah-info-text">سورة البقرة - آية 6</div>
    <div class="ayah-btn-group">
        <button class="act-btn" onclick="playSelectedAyah()"><i class="fa-solid fa-play"></i> تلاوة</button>
        <button class="act-btn" onclick="openTafsir()"><i class="fa-solid fa-book-open"></i> تفسير</button>
        <button class="act-btn" onclick="copyAyah()"><i class="fa-solid fa-copy"></i> نسخ</button>
        <button class="act-btn close" onclick="deselectAyah()"><i class="fa-solid fa-xmark"></i></button>
    </div>
</div>

<!-- زر الإعدادات والانتقال -->
<button class="fab-settings" onclick="toggleSettings()"><i class="fa-solid fa-sliders"></i></button>

<div id="settingsDialog" class="settings-dialog">
    <label style="font-weight: 800; color: var(--primary-dark);">انتقال لصفحة (1 - 604):</label>
    <div style="display: flex; gap: 8px;">
        <input type="number" id="pageJumpInput" min="1" max="604" value="3">
        <button class="act-btn" style="background: var(--primary-blue); color: #fff;" onclick="jumpToPage()">انتقال</button>
    </div>
    
    <label style="font-weight: 800; color: var(--primary-dark); margin-top: 6px;">القارئ:</label>
    <select id="reciterSelect">
        <option value="ar.alafasy">مشاري العفاسي</option>
        <option value="ar.husary">محمود خليل الحصري</option>
        <option value="ar.minshawi">محمد صديق المنشاوي</option>
    </select>
    
    <button class="act-btn" style="background: #e74c3c; color: #fff; justify-content: center;" onclick="stopAudio()"><i class="fa-solid fa-stop"></i> إيقاف التلاوة</button>
</div>

<!-- نافذة التفسير -->
<div id="tafsirModal" class="tafsir-modal">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px;">
        <h3 id="tafsirTitle" style="margin: 0; color: var(--primary-dark);">التفسير الميسر</h3>
        <button onclick="closeTafsir()" style="border: none; background: none; font-size: 1.4rem; color: #c0392b; cursor: pointer;">&times;</button>
    </div>
    <div id="tafsirBody" class="tafsir-scroll"></div>
</div>

<script>
    let currentPage = 3; // نبدأ بصفحة 3 لمقارنتها بصورتك مباشرة
    let currentVerses = [];
    let lineToVerseMap = {};
    let selectedVerseKey = null;
    let audioPlayer = new Audio();

    function toArabicDigits(num) {
        return String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    window.onload = () => loadPage(currentPage);

    async function loadPage(pageNum) {
        document.getElementById('loader').style.display = 'block';
        deselectAyah();
        stopAudio();
        document.getElementById('pageJumpInput').value = pageNum;

        const p3 = String(pageNum).padStart(3, '0');
        const img = document.getElementById('mushafImage');
        
        // صور مجمع الملك فهد الأصلية عالية الدقة والسرعة
        img.src = `https://raw.githubusercontent.com/quran/quran.com-images/master/width_1920/page${p3}.png`;
        img.onload = () => { document.getElementById('loader').style.display = 'none'; };

        try {
            // جلب أسطر الآيات للصفحة الحالية ديناميكياً من الـ API لـ 604 صفحات
            const res = await fetch(`https://api.quran.com/api/v4/verses/by_page/${pageNum}?words=true&word_fields=line_number`);
            const data = await res.json();
            currentVerses = data.verses;
            
            buildPageLines(pageNum, currentVerses);
            showToast(`تم فتح صفحة ${pageNum}`);
        } catch (e) {
            console.error(e);
            showToast("تعذر جلب بيانات الصفحة.");
        }
    }

    // بناء شبكة الأسطر الـ 15 وربط كل سطر بآيته تلقائياً
    function buildPageLines(pageNum, verses) {
        const overlay = document.getElementById('linesOverlay');
        overlay.innerHTML = '';
        lineToVerseMap = {};

        // حصر الأسطر التابعة لكل آية في هذه الصفحة
        verses.forEach(v => {
            const lines = [...new Set(v.words.map(w => w.line_number))];
            lines.forEach(lineNum => {
                if (!lineToVerseMap[lineNum]) lineToVerseMap[lineNum] = v.verse_key;
            });
        });

        // إنشاء 15 سطراً تفاعلياً مطابقاً للمصحف
        for (let i = 1; i <= 15; i++) {
            const lineBox = document.createElement('div');
            lineBox.className = 'mushaf-line-box';
            lineBox.dataset.line = i;
            
            const verseKey = lineToVerseMap[i];
            if (verseKey) {
                lineBox.dataset.verse = verseKey;
                lineBox.onclick = () => selectAyahByVerseKey(verseKey);
            }

            overlay.appendChild(lineBox);
        }
    }

    // تظليل جميع الأسطر التي تمتد عليها الآية المحددة
    function selectAyahByVerseKey(verseKey) {
        selectedVerseKey = verseKey;

        // إزالة التظليل السابق
        document.querySelectorAll('.mushaf-line-box').forEach(l => l.classList.remove('active'));

        // تظليل كل سطر تتواجد فيه هذه الآية
        document.querySelectorAll(`.mushaf-line-box[data-verse="${verseKey}"]`).forEach(l => l.classList.add('active'));

        const [surah, ayah] = verseKey.split(':');
        document.getElementById('actionInfo').innerText = `آية ${toArabicDigits(ayah)}`;
        document.getElementById('actionBar').classList.add('show');
        document.getElementById('settingsDialog').classList.remove('show');
    }

    function deselectAyah() {
        selectedVerseKey = null;
        document.querySelectorAll('.mushaf-line-box').forEach(l => l.classList.remove('active'));
        document.getElementById('actionBar').classList.remove('show');
    }

    function changePage(direction) {
        let target = currentPage - direction; // تقليب صفحات المصحف من اليمين لليسار
        if (target >= 1 && target <= 604) {
            currentPage = target;
            loadPage(currentPage);
        }
    }

    function jumpToPage() {
        let target = parseInt(document.getElementById('pageJumpInput').value);
        if (target >= 1 && target <= 604) {
            currentPage = target;
            loadPage(currentPage);
            document.getElementById('settingsDialog').classList.remove('show');
        } else {
            alert("رقم الصفحة يجب أن يكون بين 1 و 604");
        }
    }

    function toggleSettings() {
        document.getElementById('settingsDialog').classList.toggle('show');
    }

    async function playSelectedAyah() {
        if (!selectedVerseKey) return;
        const [s, a] = selectedVerseKey.split(':');
        const reciter = document.getElementById('reciterSelect').value;
        showToast("جارٍ بدء التلاوة...");

        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/${reciter}`);
            const data = await res.json();
            audioPlayer.src = data.data.audio;
            audioPlayer.play();
        } catch (e) {
            showToast("تعذر تشغيل الصوت.");
        }
    }

    function stopAudio() {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
    }

    async function openTafsir() {
        if (!selectedVerseKey) return;
        const [s, a] = selectedVerseKey.split(':');
        const modal = document.getElementById('tafsirModal');
        const body = document.getElementById('tafsirBody');
        
        modal.classList.add('show');
        body.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ تحميل التفسير...';

        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/ar.muyassar`);
            const data = await res.json();
            
            document.getElementById('tafsirTitle').innerText = `تفسير الآية ${toArabicDigits(a)} من ${data.data.surah.name}`;
            body.innerHTML = `<strong>نص الآية:</strong><br><span style="font-family:'Amiri'; font-size:1.35rem;">${data.data.text}</span><hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;"><strong>التفسير الميسر:</strong><br>${data.data.text}`;
        } catch (e) {
            body.innerHTML = "تعذر تحميل التفسير حالياً.";
        }
    }

    function closeTafsir() {
        document.getElementById('tafsirModal').classList.remove('show');
    }

    async function copyAyah() {
        if (!selectedVerseKey) return;
        const [s, a] = selectedVerseKey.split(':');
        try {
            const res = await fetch(`https://api.alquran.cloud/v1/ayah/${s}:${a}/quran-uthmani`);
            const data = await res.json();
            navigator.clipboard.writeText(`${data.data.text} ﴿${toArabicDigits(a)}﴾ [سورة ${data.data.surah.name}]`)
                .then(() => showToast("تم نسخ الآية بنجاح!"));
        } catch (e) {
            showToast("تعذر النسخ.");
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.mushaf-container') && !e.target.closest('#actionBar') && !e.target.closest('#settingsDialog') && !e.target.closest('.fab-settings')) {
            deselectAyah();
            document.getElementById('settingsDialog').classList.remove('show');
        }
    });
</script>

</body>
</html>
