<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف المدينة - التقنية الاحترافية (QCF)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background-color: #262626;
        }
        
        /* 1. نقوم بتحميل خط مخصص للصفحة رقم 2 فقط من سيرفرات Quran.com */
        @font-face {
            font-family: 'p2';
            src: url('https://quran.com/fonts/quran/hafs/v1/woff2/p2.woff2') format('woff2');
            font-display: swap;
        }

        /* 2. نعطي حاوية المصحف هذا الخط */
        .quran-page-2 {
            font-family: 'p2', sans-serif;
            font-size: 2.5rem; /* حجم الخط يحدد حجم الصفحة */
            text-align: center;
            line-height: 1.6;
            color: #1a1a1a;
        }

        .mushaf-paper {
            background-color: #FDF7E2;
            border: 12px solid #D4C3A3;
        }

        /* تظليل الكلمة عند مرور الماوس (لإثبات أنها نصوص تفاعلية وليست صورة) */
        .word:hover {
            color: #8B0000;
            background-color: rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-10">

    <div class="mushaf-paper p-8 w-full max-w-2xl shadow-2xl rounded-sm">
        <!-- الحاوية التي ستعرض الخطوط المشفرة -->
        <div id="quran-container" class="quran-page-2">
            جاري تحميل الصفحة الاحترافية...
        </div>
    </div>

    <script>
        // جلب البيانات للصفحة 2 باستخدام الحقل code_v1
        fetch('https://api.quran.com/api/v4/verses/by_page/2?words=true&word_fields=code_v1,line_number')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('quran-container');
                container.innerHTML = ''; // تفريغ النص المؤقت

                let currentLine = 1;
                let lineDiv = document.createElement('div');
                
                data.verses.forEach(verse => {
                    verse.words.forEach(word => {
                        // إذا تغير رقم السطر، نضيف السطر القديم للصفحة ونبدأ سطراً جديداً
                        if (word.line_number !== currentLine) {
                            container.appendChild(lineDiv);
                            lineDiv = document.createElement('div');
                            currentLine = word.line_number;
                        }

                        // إنشاء عنصر (span) لكل كلمة باستخدام كود V1
                        const wordSpan = document.createElement('span');
                        wordSpan.className = 'word';
                        wordSpan.innerHTML = word.code_v1; // هنا نضع الرمز المشفر
                        
                        lineDiv.appendChild(wordSpan);
                    });
                });
                
                // إضافة السطر الأخير
                container.appendChild(lineDiv);
            })
            .catch(err => console.error("Error fetching data:", err));
    </script>
</body>
</html>
